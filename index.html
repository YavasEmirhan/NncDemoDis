:root{
  --ink:#23264A; --ink-2:#2F3360; --ink-3:#3D4278;
  --cloud:#F1F3F7; --paper:#FFFFFF; --mist:#E6EAF2; --line:#D2D8E4;
  --powder:#D6DCEB; --slate:#5A6178;
  --rose:#C2415A; --rose-soft:#F6D9DF; --rose-on-ink:#E9A3B0;
  --green:#2F7D5B; --green-soft:#DCEFE5; --amber:#8A5A00; --amber-soft:#F7E9C8;
  --f:"Schibsted", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:12px; --r-lg:22px; --wrap:1200px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;font-family:var(--f);font-size:17px;line-height:1.6;color:var(--ink);background:var(--cloud);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:32px;padding-right:32px}
[hidden]{display:none!important}
.muted{color:var(--slate)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:10px;border:1.5px solid transparent;font-weight:650;font-size:16px;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s}
.btn--ink{background:var(--ink);color:#fff}
.btn--ink:hover{background:var(--ink-3)}
.btn--line{background:transparent;border-color:var(--ink);color:var(--ink)}
.btn--line:hover{background:var(--mist)}
.btn--light{background:#fff;color:var(--ink)}
.btn--light:hover{background:var(--powder)}
.btn--sm{min-height:38px;padding:0 15px;font-size:14.5px}
.btn--danger{background:transparent;border-color:var(--rose);color:var(--rose)}
.btn--danger:hover{background:var(--rose-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:inherit}

/* demo band */
.demo-band{background:var(--ink);color:#fff;font-size:13.5px;text-align:center;padding:7px 16px}
.demo-band b{color:var(--rose-on-ink);font-weight:650}

/* header */
.head{position:sticky;top:0;z-index:40;background:rgba(241,243,247,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.head__in{display:flex;align-items:center;gap:30px;height:74px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo__mark{width:36px;height:36px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:.02em}
.logo__mark i{width:6px;height:6px;border-radius:50%;background:var(--rose);display:inline-block;margin-left:2px;align-self:flex-end;margin-bottom:9px}
.logo__txt{display:flex;flex-direction:column;line-height:1.1}
.logo__txt b{font-weight:800;font-size:19px;letter-spacing:-.01em}
.logo__txt span{font-size:12.5px;color:var(--slate)}
.nav{display:flex;gap:28px;margin-left:auto}
.nav a{text-decoration:none;font-weight:550;font-size:15.5px}
.nav a:hover{color:var(--rose)}
.head__tel{font-weight:650;text-decoration:none;font-size:15.5px;white-space:nowrap}
.menu-btn{display:none;margin-left:auto;background:none;border:0;padding:10px;cursor:pointer}
.menu-btn span{display:block;width:22px;height:2px;background:var(--ink);margin:5px 0}

/* hero */
.hero{padding:72px 0 64px}
.hero__grid{display:grid;grid-template-columns:1.15fr .85fr;gap:64px;align-items:start}
.state{display:inline-flex;gap:9px;align-items:center;font-size:15px;font-weight:550;color:var(--slate);margin-bottom:26px}
.state i{width:9px;height:9px;border-radius:50%;background:var(--powder)}
.state.is-open i{background:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.hero h1{font-weight:800;font-size:clamp(42px,6vw,80px);line-height:.98;letter-spacing:-.035em;margin:0 0 28px;max-width:12ch}
.hero__lede{font-size:19px;color:#3A3F63;max-width:46ch;margin:0 0 34px}
.hero__cta{display:flex;gap:12px;flex-wrap:wrap}
.openings{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:26px 26px 18px}
.openings h2{font-size:20px;font-weight:750;margin:0 0 2px;letter-spacing:-.01em}
.openings p.sub{margin:0 0 18px;color:var(--slate);font-size:14.5px}
.oday{padding:14px 0;border-top:1px solid var(--mist)}
.oday b{display:block;font-size:14.5px;font-weight:650;margin-bottom:9px}
.oday__slots{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{border:1.5px solid var(--line);background:var(--cloud);border-radius:8px;padding:8px 13px;font-size:14.5px;font-weight:600;cursor:pointer;text-decoration:none}
.chipbtn:hover{border-color:var(--ink);background:#fff}
.openings__foot{display:flex;justify-content:space-between;align-items:center;padding-top:14px;border-top:1px solid var(--mist);font-size:14.5px}
.openings__foot a{font-weight:650}

/* facts */
.facts{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--paper)}
.facts__in{display:grid;grid-template-columns:repeat(4,1fr)}
.fact{padding:24px 26px;border-left:1px solid var(--line)}
.fact:first-child{border-left:0;padding-left:0}
.fact b{display:block;font-size:20px;font-weight:750;letter-spacing:-.01em}
.fact span{font-size:14.5px;color:var(--slate)}

/* sections */
.sec{padding:104px 0}
.sec h2.title{font-size:clamp(34px,4.2vw,54px);font-weight:800;letter-spacing:-.03em;line-height:1.02;margin:0 0 18px;max-width:16ch}
.sec .intro{font-size:18px;color:#3A3F63;max-width:52ch;margin:0}
.svc-head{display:flex;justify-content:space-between;align-items:end;gap:30px;flex-wrap:wrap;margin-bottom:46px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:0 64px}
.menu__item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:baseline;padding:20px 0;border-bottom:1px solid var(--line)}
.menu__item h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.menu__item .lead{border-bottom:2px dotted var(--powder);transform:translateY(-5px)}
.menu__item .dur{font-size:14.5px;color:var(--slate);white-space:nowrap}
.menu__item p{grid-column:1 / -1;margin:2px 0 0;color:#454A6E;font-size:15.5px;max-width:52ch}

.about{background:var(--ink);color:#fff}
.about__grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:80px;align-items:start}
.photo{aspect-ratio:4/5;border-radius:var(--r-lg);background:var(--ink-2);border:1px solid var(--ink-3);overflow:hidden;display:grid;place-items:center;position:sticky;top:110px}
.photo img{width:100%;height:100%;object-fit:cover}
.photo span{font-size:110px;font-weight:800;letter-spacing:-.05em;color:var(--ink-3)}
.about h2.title{color:#fff}
.about p{color:#D3D6E8;max-width:60ch}
.about .big{font-size:21px;line-height:1.5;color:#fff}
.about h3{font-size:22px;font-weight:750;margin:46px 0 10px;letter-spacing:-.01em;color:#fff}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:0 36px;margin:14px 0 0;padding:0;list-style:none}
.pairs li{padding:16px 0;border-top:1px solid var(--ink-3)}
.pairs b{display:block;color:#fff;font-weight:650}
.pairs span{color:#C3C7DD;font-size:15.5px}
.score{display:flex;gap:18px;align-items:center;margin-top:34px;padding:20px 22px;border-radius:var(--r);background:var(--ink-2)}
.score strong{font-size:46px;font-weight:800;color:var(--rose-on-ink);line-height:1;letter-spacing:-.03em}
.score p{margin:0;font-size:15.5px}
.score a{color:#fff}

.visit__grid{display:grid;grid-template-columns:1.2fr .8fr;gap:52px;margin-top:44px}
.map{border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);background:var(--mist);min-height:430px;position:relative}
.map::before{content:"Map loads when you are online";position:absolute;inset:0;display:grid;place-items:center;color:var(--slate);font-size:14px}
.map iframe{position:relative;width:100%;height:100%;min-height:430px;border:0;display:block}
.route{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.route input{flex:1 1 240px;min-height:48px;border-radius:10px;border:1.5px solid var(--line);background:#fff;padding:0 16px}
.route input:focus{border-color:var(--ink);outline:none}
.vinfo h3{font-size:20px;font-weight:750;margin:0 0 8px}
.vinfo address{font-style:normal;margin-bottom:14px}
.vinfo .btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:34px}
.hours{width:100%;border-collapse:collapse;margin-bottom:28px}
.hours td{padding:9px 0;border-bottom:1px solid var(--line)}
.hours td:last-child{text-align:right}
.hours tr.is-today td{font-weight:700}
.hours tr.is-today td:first-child::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--rose);margin-right:9px;vertical-align:middle}
.notes{list-style:none;padding:0;margin:0}
.notes li{padding:10px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.notes b{display:block}

.faq__grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:64px}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:22px 40px 22px 0;font-size:19px;font-weight:650;position:relative}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";position:absolute;right:4px;top:17px;font-size:26px;font-weight:400;color:var(--slate)}
details[open] summary::after{content:"–"}
details p{margin:0 0 22px;color:#454A6E;max-width:62ch}

.foot{background:var(--ink);color:#C3C7DD;padding:58px 0 30px;font-size:15px}
.foot__grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:36px}
.foot b{color:#fff;display:block;margin-bottom:8px;font-weight:650}
.foot a{color:#C3C7DD}
.foot__base{margin-top:44px;padding-top:20px;border-top:1px solid var(--ink-3);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13.5px}
.foot .logo__mark{background:#fff;color:var(--ink)}
.foot .logo__txt b{color:#fff}
.foot .logo__txt span{color:#C3C7DD}

/* booking page */
.bookpage{padding:48px 0 96px}
.bookpage__grid{display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr);gap:56px;align-items:start}
.bookpage__grid > *{min-width:0}
.bp-side{position:sticky;top:106px}
.bp-side h1{font-size:clamp(34px,4vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1.02;margin:0 0 16px}
.bp-side p{color:#3A3F63;margin:0 0 20px}
.picked{background:var(--ink);color:#fff;border-radius:var(--r-lg);padding:22px 24px;margin:22px 0}
.picked small{color:var(--powder);display:block;font-size:13.5px}
.picked b{display:block;font-size:22px;font-weight:750;letter-spacing:-.01em;margin:2px 0 8px}
.picked span{color:#C3C7DD;font-size:14.5px;display:block}
.privacy-note{font-size:14px;color:var(--slate);border-left:3px solid var(--rose);padding:4px 0 4px 14px;margin:0}
.bform{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:8px 32px 32px}
.bstep{padding:26px 0;border-bottom:1px solid var(--mist)}
.bstep:last-of-type{border-bottom:0}
.bstep h2{font-size:19px;font-weight:750;margin:0 0 16px;display:flex;gap:12px;align-items:center;letter-spacing:-.01em}
.bstep h2 i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px 16px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;background:#fff;text-align:left;font-weight:600}
.type small{font-weight:500;color:var(--slate);font-size:13.5px;white-space:nowrap}
.type:hover{border-color:var(--powder)}
.type.is-on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dates{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;scroll-snap-type:x mandatory}
.date{flex:none;width:72px;padding:10px 0;border-radius:10px;border:1.5px solid var(--line);background:#fff;cursor:pointer;text-align:center;scroll-snap-align:start}
.date small{display:block;font-size:12.5px;color:var(--slate)}
.date b{display:block;font-size:24px;font-weight:750;line-height:1.2}
.date.is-on{background:var(--ink);border-color:var(--ink);color:#fff}
.date.is-on small{color:var(--powder)}
.date:disabled{opacity:.38;cursor:not-allowed;background:var(--mist)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.slot{padding:11px 0;border-radius:8px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-weight:650}
.slot:hover{border-color:var(--ink)}
.slot.is-on{background:var(--rose);border-color:var(--rose);color:#fff}
.slot-group{font-size:13.5px;font-weight:650;color:var(--slate);margin:4px 0 8px}
.empty{padding:20px;border-radius:10px;background:var(--mist);color:#3A3F63;font-size:15.5px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label,.field .lab{font-weight:650;font-size:15px}
.field .help{font-size:13.5px;color:var(--slate);font-weight:400}
.field input[type=text],.field input[type=tel],.field input[type=email],.field input[type=date],.field input[type=time],.field input[type=number],.field input[type=password],.field select,.field textarea{min-height:46px;border-radius:9px;border:1.5px solid var(--line);background:#fff;padding:10px 14px;font-size:16px;width:100%}
.field textarea{min-height:80px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px var(--powder)}
.field.has-err input{border-color:var(--rose)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px}
.seg2{display:inline-flex;gap:8px;flex-wrap:wrap}
.seg2 button{padding:9px 16px;border-radius:9px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-weight:600;font-size:15px}
.seg2 button.is-on{background:var(--ink);border-color:var(--ink);color:#fff}
.check{display:flex;gap:12px;align-items:flex-start;font-size:15px;cursor:pointer;margin-bottom:10px}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--ink);flex:none}
.bform__foot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-top:22px;border-top:1px solid var(--mist)}
.err{color:var(--rose);font-weight:550;font-size:15px}
.done{text-align:left}
.done__tick{width:56px;height:56px;border-radius:50%;background:var(--rose);display:grid;place-items:center;margin-bottom:18px}
.done h2{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:0 0 8px}
.ref{font-weight:750;letter-spacing:.06em;background:var(--mist);padding:3px 10px;border-radius:7px}
.sumlist{display:grid;grid-template-columns:120px 1fr;margin:22px 0;border-top:1px solid var(--mist)}
.sumlist dt,.sumlist dd{margin:0;padding:11px 0;border-bottom:1px solid var(--mist)}
.sumlist dt{color:var(--slate)}
.sumlist dd{font-weight:600}

@media (max-width:980px){
  .hero__grid,.about__grid,.visit__grid,.faq__grid,.bookpage__grid{grid-template-columns:1fr;gap:40px}
  .photo,.bp-side{position:static}
  .photo{max-width:360px}
  .facts__in{grid-template-columns:1fr 1fr}
  .fact:nth-child(3){border-left:0;padding-left:0}
  .fact:nth-child(n+3){border-top:1px solid var(--line)}
  .menu{grid-template-columns:1fr}
  .foot__grid{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  body{font-size:16px}
  .wrap{padding-left:20px;padding-right:20px}
  .nav,.head__tel,.head .btn{display:none}
  .menu-btn{display:block}
  .head.open .nav{display:flex;position:absolute;top:74px;left:0;right:0;flex-direction:column;gap:0;background:var(--cloud);border-bottom:1px solid var(--line);padding:6px 20px 16px}
  .head.open .nav a{padding:12px 0;border-bottom:1px solid var(--line)}
  .hero{padding:36px 0 52px}
  .sec{padding:72px 0}
  .pairs,.types,.grid2,.grid3{grid-template-columns:1fr}
  .bform{padding:4px 18px 22px}
  .foot__grid{grid-template-columns:1fr}
}

/* ================= PANEL ================= */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh;font-size:15px}
.side{background:var(--ink);color:#C3C7DD;display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh}
.side .logo{padding:2px 8px 22px}
.side .logo__mark{background:#fff;color:var(--ink)}
.side .logo__txt b{color:#fff}
.side .logo__txt span{color:var(--powder)}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;text-decoration:none;font-weight:550;color:#C3C7DD;position:relative}
.side nav a:hover{background:var(--ink-2);color:#fff}
.side nav a.is-on{background:var(--ink-2);color:#fff}
.side nav a.is-on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--rose)}
.side nav svg{width:18px;height:18px;flex:none}
.side .count{margin-left:auto;background:var(--rose);color:#fff;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px}
.side__user{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--ink-3);font-size:13.5px}
.side__user b{display:block;color:#fff;font-weight:650}
.side__user a{color:var(--powder)}
.rolechip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--ink-3);color:var(--powder);margin:4px 0 10px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:16px;padding:16px 32px;border-bottom:1px solid var(--line);background:var(--cloud);position:sticky;top:0;z-index:20}
.topbar h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0;white-space:nowrap}
.topbar .date{color:var(--slate);font-size:14px;white-space:nowrap;width:auto;border:0;padding:0;background:none;cursor:default;text-align:left}
.search{margin-left:auto;position:relative}
.search input{min-height:40px;width:250px;border-radius:9px;border:1.5px solid var(--line);background:#fff;padding:0 14px 0 36px;font-size:14.5px}
.search input:focus{outline:none;border-color:var(--ink)}
.search svg{position:absolute;left:12px;top:11px;width:17px;height:17px;color:var(--slate)}
.side-toggle{display:none;background:none;border:0;padding:6px;cursor:pointer}
.content{padding:26px 32px 60px}
.demo-strip{background:var(--rose-soft);color:#7A2236;font-size:13.5px;padding:7px 32px;border-bottom:1px solid #EFC3CC}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.kpi span{display:block;color:var(--slate);font-size:14px}
.kpi b{display:block;font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.kpi small{color:var(--slate);font-size:13px}
.kpi--hot{border-color:#EFC3CC;background:var(--rose-soft)}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:18px;min-width:0}
.panel__head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line)}
.panel__head h2{font-size:16px;font-weight:750;margin:0}
.panel__head .muted{font-size:13.5px}
.panel__body{padding:16px 20px}
.agenda{list-style:none;margin:0;padding:0}
.agenda li{display:grid;grid-template-columns:80px 4px 1fr auto;gap:14px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--mist);cursor:pointer}
.agenda li:last-child{border-bottom:0}
.agenda li:hover{background:#F8F9FC}
.agenda time{font-weight:700;font-size:14.5px}
.agenda .bar{align-self:stretch;border-radius:4px}
.agenda b{display:block;font-weight:650}
.agenda .sub{font-size:13.5px;color:var(--slate)}
.agenda .none{display:block;cursor:default;color:var(--slate);padding:24px 20px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:650;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-requested{background:var(--amber-soft);color:var(--amber)}
.st-confirmed{background:var(--green-soft);color:var(--green)}
.st-checked_in{background:var(--powder);color:var(--ink)}
.st-completed{background:var(--mist);color:var(--slate)}
.st-cancelled{background:var(--rose-soft);color:#9A2D44}
.st-no_show{background:#EEE3E6;color:#7A3B4A}
.src{font-size:12px;color:var(--slate);border:1px solid var(--line);padding:1px 8px;border-radius:999px;white-space:nowrap}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;padding-top:10px}
.week__col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:12.5px;color:var(--slate)}
.week__bar{width:100%;max-width:34px;background:var(--powder);border-radius:6px 6px 2px 2px;min-height:3px}
.week__col.is-today .week__bar{background:var(--ink)}
.week__col.is-today{color:var(--ink);font-weight:700}
.week__col b{color:var(--ink);font-size:13px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar select{min-height:38px;border-radius:9px;border:1.5px solid var(--line);background:#fff;padding:0 12px;font-size:14px}
.seg{display:inline-flex;background:var(--mist);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:7px;font-size:13.5px;font-weight:650;cursor:pointer;color:var(--slate)}
.seg button.is-on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(35,38,74,.12)}
.table-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-weight:650;font-size:13px;color:var(--slate);padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FAFBFD}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--mist);vertical-align:middle}
.tbl tbody tr[data-act]{cursor:pointer}
.tbl tbody tr[data-act]:hover{background:#F8F9FC}
.tbl .num{white-space:nowrap}
.tbl b{font-weight:650}
.tbl .sub{font-size:13px;color:var(--slate)}
.empty-state{padding:44px 24px;text-align:center;color:var(--slate)}
.empty-state b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}

.cal{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
.cal__head{display:grid;border-bottom:1px solid var(--line);background:#FAFBFD}
.cal__head div{padding:10px;font-size:13.5px;font-weight:650;text-align:center;border-left:1px solid var(--mist)}
.cal__head div:first-child{border-left:0}
.cal__head .is-today{background:var(--rose-soft);color:#7A2236}
.cal__head small{display:block;font-weight:400;color:var(--slate)}
.cal__body{display:grid;position:relative}
.cal__times div{height:48px;font-size:12px;color:var(--slate);text-align:right;padding:2px 8px 0 0;border-top:1px solid var(--mist)}
.cal__day{position:relative;border-left:1px solid var(--mist)}
.cal__day.is-closed{background:repeating-linear-gradient(135deg,#F6F7FA 0 8px,#EEF0F5 8px 16px)}
.cal__slot{height:24px;border-top:1px solid var(--mist)}
.cal__slot.can{cursor:copy}
.cal__slot.can:hover{background:var(--powder)}
.cal__slot:nth-child(2n){border-top-style:dashed;border-top-color:#EEF0F5}
.cal__appt{position:absolute;left:3px;right:3px;border-radius:7px;padding:4px 7px;font-size:12px;line-height:1.25;overflow:hidden;cursor:pointer;border-left:4px solid;background:var(--mist)}
.cal__appt b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal__appt.is-off{opacity:.45;text-decoration:line-through}
.cal__appt.is-req{background:var(--amber-soft)}
.cal__now{position:absolute;left:0;right:0;height:2px;background:var(--rose);z-index:2}

.scrim{position:fixed;inset:0;background:rgba(20,22,46,.42);z-index:80;animation:fade .15s}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(12px);opacity:0}}
@keyframes slide{from{transform:translateX(26px);opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--cloud);z-index:81;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(20,22,46,.18);animation:slide .2s ease}
.drawer__head{padding:20px 24px;background:#fff;border-bottom:1px solid var(--line)}
.drawer__head h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:6px 0 2px}
.drawer__top{display:flex;justify-content:space-between;align-items:center;gap:10px}

.add-card{border:1.5px dashed var(--powder);background:transparent;border-radius:var(--r);min-height:190px;display:grid;place-items:center;cursor:pointer;font-weight:650;color:var(--slate)}

<script>
(() => {
'use strict';

/* ============ basics ============ */
const TZ = 'America/Chicago';
const KEY = 'qbdental.demo.v2';
const USER_KEY = 'qbdental.v2.user';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => p + Math.random().toString(36).slice(2, 9);
const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const DAY3 = DAYS.map(d => d.slice(0, 3));
const WEEK = [1, 2, 3, 4, 5, 6, 0];
const STATUS = { requested: 'Requested', confirmed: 'Confirmed', checked_in: 'Checked in', completed: 'Completed', cancelled: 'Cancelled', no_show: 'No-show' };
const SOURCES = { website: 'Website', phone: 'Phone', walkin: 'Walk-in' };
const COLORS = ['#3D4278', '#2F7D5B', '#C2415A', '#8A5A00', '#5C4B8A', '#2E6C8A'];
const ROLES = {
  doctor: { label: 'Doctor', can: ['view', 'status_clinical'] },
  desk: { label: 'Front desk', can: ['view', 'status_clinical', 'status_desk', 'create', 'edit', 'note'] },
  manager: { label: 'Office manager', can: ['view', 'status_clinical', 'status_desk', 'create', 'edit', 'note', 'delete', 'export', 'settings', 'doctors', 'activity'] }
};
const STATUS_PERM = { requested: 'status_desk', confirmed: 'status_desk', cancelled: 'status_desk', no_show: 'status_desk', checked_in: 'status_clinical', completed: 'status_clinical' };

const pad = n => String(n).padStart(2, '0');
const toMin = t => { const [h, m] = String(t).split(':').map(Number); return h * 60 + m; };
const toHHMM = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
const parseD = d => { const [y, m, x] = d.split('-').map(Number); return new Date(Date.UTC(y, m - 1, x)); };
const addDays = (d, n) => { const x = parseD(d); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const dow = d => parseD(d).getUTCDay();
const mondayOf = d => { const w = dow(d); return addDays(d, w === 0 ? -6 : 1 - w); };
const fmtTime = t => { if (!t) return ''; const m = toMin(t); let h = Math.floor(m / 60); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${pad(m % 60)} ${ap}`; };
const fmtDate = (d, o = { weekday: 'short', month: 'short', day: 'numeric' }) => parseD(d).toLocaleDateString('en-US', { ...o, timeZone: 'UTC' });
const fmtLong = d => fmtDate(d, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
const digits = s => String(s || '').replace(/\D/g, '');
const fmtPhone = s => { const d = digits(s).replace(/^1(?=\d{10}$)/, ''); return d.length === 10 ? `(${d.slice(0, 3)}) ${d.slice(3, 6)}-${d.slice(6)}` : String(s || '').trim(); };
const stamp = () => new Date().toISOString();
const fmtStamp = iso => new Date(iso).toLocaleString('en-US', { timeZone: TZ, month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const initials = n => String(n || '').replace(/^Dr\.?\s+/i, '').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
function nowParts() {
  const f = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  const p = Object.fromEntries(f.formatToParts(new Date()).map(x => [x.type, x.value]));
  return { date: `${p.year}-${p.month}-${p.day}`, min: (+p.hour % 24) * 60 + +p.minute };
}
const makeRef = () => { const a = 'ACDEFGHJKMNPQRTUVWXY34679'; let s = ''; for (let i = 0; i < 5; i++) s += a[Math.floor(Math.random() * a.length)]; return 'QB-' + s; };

/* ============ data ============ */
function baseData() {
  const h = (open, start = '09:30', end = '16:00') => ({ open, start, end });
  const hours = { 0: h(false), 1: h(true), 2: h(true), 3: h(true), 4: h(true), 5: h(false), 6: h(true, '10:00', '14:00') };
  const sched = {}; for (let i = 0; i < 7; i++) sched[i] = { on: hours[i].open, start: hours[i].start, end: hours[i].end };
  return {
    version: 2,
    settings: {
      clinicName: 'QB Dental Implant and Integrative Dentistry', shortName: 'QB Dental', doctorLine: 'Kubra Atici, DDS',
      phone: '(847) 545-8458', street: '1608 N Arlington Heights Rd', city: 'Arlington Heights', state: 'IL', zip: '60004',
      hours, slotInterval: 30, leadHours: 2, maxDays: 60,
      closedDates: [{ date: '2026-11-26', label: 'Thanksgiving' }, { date: '2026-12-24', label: 'Christmas Eve' }],
      bookingEnabled: true, autoConfirm: false, rating: '4.8', ratingCount: '37',
      retention: { inactiveDays: 30, completedDays: 90 }
    },
    visitTypes: [
      { id: 'v_new', name: 'New patient visit', duration: 60, active: true },
      { id: 'v_clean', name: 'Checkup and cleaning', duration: 60, active: true },
      { id: 'v_consult', name: 'Consultation', duration: 30, active: true },
      { id: 'v_urgent', name: 'Urgent visit', duration: 30, active: true }
    ],
    services: [
      { name: 'Dental implants', note: 'Consultation, planning and restoration for missing teeth.', dur: 'Consult 30 min' },
      { name: 'Checkups and cleanings', note: 'Exam, professional cleaning and X-rays when you are due.', dur: '60 min' },
      { name: 'Fillings and crowns', note: 'Repair cavities, cracks and worn fillings with tooth-colored materials.', dur: 'Varies' },
      { name: 'Root canal treatment', note: 'Save an infected or damaged tooth.', dur: 'Varies' },
      { name: 'Extractions', note: 'Gentle removal when a tooth cannot be saved, with a plan for what comes next.', dur: 'Varies' },
      { name: 'Veneers', note: 'Change the shape, shade or spacing of front teeth.', dur: 'Consult 30 min' },
      { name: 'Urgent visits', note: 'Pain, swelling or a broken tooth. Call us and we will find the earliest time.', dur: '30 min' },
      { name: 'Second opinions', note: 'Bring a plan from another office and we will go through it with you.', dur: '30 min' }
    ],
    doctors: [{ id: 'd_kubra', name: 'Dr. Kubra Atici', title: 'DDS', role: 'General, implant and integrative dentistry', color: COLORS[0], photo: '', active: true, onSite: true, schedule: sched,
      bio: 'Dr. Atici leads the practice. Her focus is dental implants and an integrative approach to everyday care: looking at your mouth as part of your overall health and choosing the most conservative treatment that will last.' }],
    users: [
      { id: 'u_doc', name: 'Dr. Kubra Atici', role: 'doctor' },
      { id: 'u_desk', name: 'Front desk', role: 'desk' },
      { id: 'u_mgr', name: 'Office manager', role: 'manager' }
    ],
    appointments: [], audit: []
  };
}
function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function seed(db) {
  const r = rng(424242), n = nowParts();
  const people = [['Maria', 'Lopez'], ['James', 'Carter'], ['Aylin', 'Demir'], ['Tom', 'Becker'], ['Priya', 'Shah'], ['Nadia', 'Petrova'], ['Kevin', "O'Brien"], ['Hannah', 'Kim'], ['Luis', 'Romero'], ['Grace', 'Walsh'], ['Omar', 'Haddad'], ['Elena', 'Rossi']];
  let pi = 0;
  for (let off = -12; off <= 12; off++) {
    const d = addDays(n.date, off);
    const cnt = off === 0 ? 4 : Math.abs(off) <= 3 ? 2 : (r() < .6 ? 1 : 2);
    for (let k = 0; k < cnt; k++) {
      const vt = db.visitTypes[Math.floor(r() * db.visitTypes.length)];
      const sl = slots(db, d, vt.id, 'any', { ignoreLead: true, ignoreLimits: true });
      if (!sl.length) break;
      const s = sl[Math.floor(r() * sl.length)];
      const p = people[pi++ % people.length];
      let status;
      if (off < 0) { const x = r(); status = x < .12 ? 'no_show' : x < .22 ? 'cancelled' : 'completed'; }
      else if (off === 0) status = toMin(s.time) + vt.duration <= n.min ? 'completed' : toMin(s.time) <= n.min ? 'checked_in' : 'confirmed';
      else status = off <= 4 && r() < .55 ? 'requested' : 'confirmed';
      const created = new Date(Date.now() - (Math.max(1, 6 - off) + r() * 3) * 864e5).toISOString();
      db.appointments.push({ id: uid('a_'), ref: makeRef(), createdAt: created, source: r() < .7 ? 'website' : 'phone', status,
        visitTypeId: vt.id, doctorId: s.doctorIds[0], date: d, time: s.time, duration: vt.duration,
        patient: { first: p[0], last: p[1], phone: `(847) 555-01${pad(10 + pi)}`, email: r() < .6 ? `${p[0].toLowerCase()}@example.com` : '', returning: r() < .6, sms: r() < .7 },
        note: '', history: [{ at: created, text: 'Created (demo data)' }], demo: true });
    }
  }
}
let MEM = null;
function load() { try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) { } return MEM ? JSON.parse(MEM) : null; }
function save() { const s = JSON.stringify(DB); MEM = s; try { localStorage.setItem(KEY, s); } catch (e) { } }
function migrate(db) { const b = baseData(); db.settings = { ...b.settings, ...db.settings, retention: { ...b.settings.retention, ...(db.settings || {}).retention } }; ['visitTypes', 'services', 'doctors', 'users', 'appointments', 'audit'].forEach(k => { if (!Array.isArray(db[k])) db[k] = b[k]; }); return db; }
function fresh() { const db = baseData(); seed(db); db.audit.push({ at: stamp(), user: 'System', action: 'Demo data created', target: '' }); return db; }
// clean up the earlier demo (v1) which held more personal data than this version needs
try { localStorage.removeItem('qbdental.demo.v1'); } catch (e) { }
let DB = load(); DB = DB ? migrate(DB) : fresh(); save();

const vtById = id => DB.visitTypes.find(v => v.id === id);
const docById = id => DB.doctors.find(d => d.id === id);
const apById = id => DB.appointments.find(a => a.id === id);
const fullName = p => `${p.first || ''} ${p.last || ''}`.trim();

/* ============ availability ============ */
function slots(db, date, vtId, pref, o = {}) {
  const S = db.settings, vt = db.visitTypes.find(v => v.id === vtId), dur = vt ? vt.duration : 30, n = nowParts();
  if (!o.ignoreLimits && (date < n.date || date > addDays(n.date, S.maxDays))) return [];
  if (S.closedDates.some(c => c.date === date)) return [];
  const ch = S.hours[dow(date)]; if (!ch || !ch.open) return [];
  const docs = db.doctors.filter(d => d.active && (pref === 'any' || d.id === pref));
  const map = new Map(), step = +S.slotInterval || 30;
  for (const d of docs) {
    const ds = d.schedule[dow(date)]; if (!ds || !ds.on) continue;
    const st = Math.max(toMin(ch.start), toMin(ds.start)), en = Math.min(toMin(ch.end), toMin(ds.end));
    const busy = db.appointments.filter(a => a.doctorId === d.id && a.date === date && a.id !== o.excludeId && a.status !== 'cancelled').map(a => [toMin(a.time), toMin(a.time) + a.duration]);
    for (let t = st; t + dur <= en; t += step) {
      if (!o.ignoreLead && date === n.date && t < n.min + (+S.leadHours || 0) * 60) continue;
      if (busy.some(([s, e]) => t < e && t + dur > s)) continue;
      const k = toHHMM(t); if (!map.has(k)) map.set(k, []); map.get(k).push(d.id);
    }
  }
  return [...map.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1).map(([time, doctorIds]) => ({ time, doctorIds }));
}
const slotsFor = (...a) => slots(DB, ...a);
function openState() {
  const S = DB.settings, n = nowParts(), h = S.hours[dow(n.date)], closed = S.closedDates.some(c => c.date === n.date);
  if (!closed && h.open && n.min >= toMin(h.start) && n.min < toMin(h.end)) return { open: true, text: `Open today until ${fmtTime(h.end)}` };
  if (!closed && h.open && n.min < toMin(h.start)) return { open: false, text: `Opens today at ${fmtTime(h.start)}` };
  for (let i = 1; i <= 14; i++) { const d = addDays(n.date, i), x = S.hours[dow(d)]; if (x.open && !S.closedDates.some(c => c.date === d)) return { open: false, text: `Closed now, opens ${i === 1 ? 'tomorrow' : DAYS[dow(d)]} at ${fmtTime(x.start)}` }; }
  return { open: false, text: 'Closed now' };
}

/* ============ retention (automatic deletion) ============ */
const INACTIVE = ['cancelled', 'no_show', 'requested'];
function deleteDate(a) {
  const R = DB.settings.retention;
  if (a.status === 'requested' && a.date >= nowParts().date) return null;
  if (a.status === 'completed') return addDays(a.date, +R.completedDays);
  if (INACTIVE.includes(a.status)) return addDays(a.date, +R.inactiveDays);
  return null; // confirmed / checked in: kept until the visit is resolved
}
function runRetention(user = 'System') {
  const today = nowParts().date; const before = DB.appointments.length;
  DB.appointments = DB.appointments.filter(a => { const d = deleteDate(a); return !(d && d < today && a.date < today); });
  const gone = before - DB.appointments.length;
  if (gone) { log(user, 'Automatic deletion', `${gone} appointment${gone === 1 ? '' : 's'} past the retention period`); }
  return gone;
}
function log(user, action, target) { DB.audit.push({ at: stamp(), user, action, target }); if (DB.audit.length > 2000) DB.audit = DB.audit.slice(-2000); }

/* ============ shared ui ============ */
const root = () => $('#root'), layer = () => $('#layer');

function refreshBookForm() { const f = $('#bform'); if (f) f.innerHTML = BK.done ? doneHTML() : formHTML(); const p = $('#picked'); if (p) p.innerHTML = pickedHTML(); }
function bookSubmit() {
  BK.err = ''; $$('.field.has-err').forEach(x => x.classList.remove('has-err'));
  const miss = [], mark = id => { const e = $('#f-' + id); if (e) e.classList.add('has-err'); };
  if (!BK.vt) miss.push('a visit type'); if (!BK.time) miss.push('a time');
  if (!BK.first.trim()) { miss.push('first name'); mark('first'); }
  if (!BK.last.trim()) { miss.push('last name'); mark('last'); }
  if (digits(BK.phone).length < 10) { miss.push('a 10-digit mobile number'); mark('phone'); }
  if (BK.email && !/^\S+@\S+\.\S+$/.test(BK.email)) { miss.push('a valid email'); mark('email'); }
  if (BK.returning === null) miss.push('whether you have visited before');
  if (miss.length) BK.err = 'Please add ' + miss.join(', ') + '.';
  else if (!BK.consent) BK.err = 'Please tick the box to confirm how we will use your details.';
  if (BK.err) { $('#bk-err').textContent = BK.err; return; }
  const vt = vtById(BK.vt), s = slotsFor(BK.date, BK.vt, BK.doctor).find(x => x.time === BK.time);
  if (!s) { BK.time = ''; BK.err = 'That time was just taken. Please choose another.'; refreshBookForm(); return; }
  const status = DB.settings.autoConfirm ? 'confirmed' : 'requested';
  const a = { id: uid('a_'), ref: makeRef(), createdAt: stamp(), source: 'website', status, visitTypeId: vt.id, doctorId: BK.doctor === 'any' ? s.doctorIds[0] : BK.doctor, date: BK.date, time: BK.time, duration: vt.duration,
    patient: { first: BK.first.trim(), last: BK.last.trim(), phone: fmtPhone(BK.phone), email: BK.email.trim(), returning: BK.returning, sms: BK.sms }, note: '', history: [{ at: stamp(), text: 'Requested on the website' }] };
  DB.appointments.push(a); log('Website', 'Appointment requested', a.ref); save();
  BK.done = a; refreshBookForm(); window.scrollTo(0, 0);
}
function ics(a) {
  const vt = vtById(a.visitTypeId), dt = (d, m) => d.replace(/-/g, '') + 'T' + toHHMM(m).replace(':', '') + '00', s = toMin(a.time);
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//QB Dental//EN', 'BEGIN:VEVENT', `UID:${a.id}@qbdental`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)}Z`,
    `DTSTART;TZID=${TZ}:${dt(a.date, s)}`, `DTEND;TZID=${TZ}:${dt(a.date, s + a.duration)}`, `SUMMARY:${DB.settings.shortName} appointment`, `LOCATION:${addr().replace(/,/g, '\\,')}`,
    `DESCRIPTION:Code ${a.ref}. Call ${DB.settings.phone} to change.`, 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
}

  if (!date) return '<option value="">Pick a date</option>';
  const s = slotsFor(date, vt, doc, { ignoreLead: true, ignoreLimits: true, excludeId: ex });
  let h = s.map(x => `<option value="${x.time}" ${x.time === cur ? 'selected' : ''}>${fmtTime(x.time)}</option>`).join('');
  if (cur && !s.some(x => x.time === cur)) h = `<option value="${cur}" selected>${fmtTime(cur)} (current)</option>` + h;
  return h || '<option value="">No free times</option>';
}

function readDoc() {

  $$('.modal [data-sc]').forEach(el => { const i = el.dataset.sc; d.schedule[i] = d.schedule[i] || {}; d.schedule[i][el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value; });
  return d;
}
function setStatus(id, st) {

  a.status = st; a.history.push({ at: stamp(), text: `${STATUS[st]} by ${u.name}` }); log(u.name, `Status set to ${STATUS[st]}`, a.ref); save(); toast(`${a.ref}: ${STATUS[st]}`);
}
function exportCSV() {

function resize(file, cb) { const fr = new FileReader(); fr.onload = () => { const im = new Image(); im.onload = () => { const sc = Math.min(1, 640 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); cb(c.toDataURL('image/jpeg', .85)); }; im.src = fr.result; }; fr.readAsDataURL(file); }

const isAdmin = () => location.hash.startsWith('#/admin');
function onClick(e) {
  const scrollTo = e.target.closest('[data-to]');
  if (scrollTo) { e.preventDefault(); const go = () => { const t = document.getElementById(scrollTo.dataset.to); if (t) t.scrollIntoView(); }; if (location.hash.startsWith('#/book')) { location.hash = '#/'; setTimeout(go, 30); } else go(); const h = $('.head'); if (h) h.classList.remove('open'); return; }

  if (['search', 'photo'].includes(act)) return;
  switch (act) {
    case 'menu': { const h = $('.head'); h.classList.toggle('open'); el.setAttribute('aria-expanded', h.classList.contains('open')); break; }
    case 'placeholder': e.preventDefault(); toast('Placeholder: the practice provides this document.'); break;
    case 'copy-addr': (navigator.clipboard ? navigator.clipboard.writeText(addr()) : Promise.reject()).then(() => toast('Address copied'), () => toast(addr())); break;
    case 'bk-vt': BK.vt = el.dataset.v; BK.err = ''; refreshBookForm(); break;
    case 'bk-date': { const sc = $('.dates').scrollLeft; BK.date = el.dataset.v; BK.time = ''; refreshBookForm(); $('.dates').scrollLeft = sc; break; }
    case 'bk-time': BK.time = el.dataset.v; $$('.slot').forEach(x => { x.classList.toggle('is-on', x === el); x.setAttribute('aria-pressed', x === el); }); $('#picked').innerHTML = pickedHTML(); break;
    case 'bk-ret': BK.returning = el.dataset.v === 'yes'; $$('[data-act="bk-ret"]').forEach(x => x.classList.toggle('is-on', x === el)); break;
    case 'bk-ics': download(`qb-dental-${BK.done.ref}.ics`, ics(BK.done), 'text/calendar'); break;
    case 'login': setMe(el.dataset.id); log(DB.users.find(x => x.id === el.dataset.id).name, 'Signed in', ''); save(); AV.view = 'today'; if (location.hash !== '#/admin/today') location.hash = '#/admin/today'; else renderAdmin(); break;
    case 'logout': e.preventDefault(); log(u.name, 'Signed out', ''); save(); setMe(null); location.hash = '#/admin'; renderLogin(); break;
    case 'side-toggle': $('#app').classList.toggle('side-open'); break;
    case 'close': closeLayer(); if (isAdmin()) refresh(); break;
    case 'open': openAppt(el.dataset.id); break;
    case 'status': e.stopPropagation(); setStatus(el.dataset.id, el.dataset.st); if (AV.drawer === el.dataset.id) openAppt(el.dataset.id, false); refresh(); refreshCount(); break;
    case 'note': { const a = apById(el.dataset.id); a.note = $('#note').value.trim().slice(0, 120); a.history.push({ at: stamp(), text: `Note updated by ${u.name}` }); log(u.name, 'Edited scheduling note', a.ref); save(); toast('Note saved'); openAppt(a.id, false); break; }
    case 'move': {
      const a = apById(el.dataset.id), doc = $('#rs-doc').value, date = $('#rs-date').value, time = $('#rs-time').value;
      if (!time) return toast('Pick a free time first');
      if (doc === a.doctorId && date === a.date && time === a.time) return toast('Nothing changed');
      a.history.push({ at: stamp(), text: `Moved to ${fmtDate(date)} ${fmtTime(time)} by ${u.name}` }); Object.assign(a, { doctorId: doc, date, time });
      log(u.name, 'Moved appointment', a.ref); save(); openAppt(a.id, false); refresh(); toast('Appointment moved'); break;
    }
    case 'del': { const a = apById(el.dataset.id); if (!confirm(`Delete ${a.ref} now? This can't be undone.`)) return; DB.appointments = DB.appointments.filter(x => x.id !== a.id); log(u.name, 'Deleted appointment', a.ref); save(); closeLayer(); refresh(); refreshCount(); toast('Deleted'); break; }

    case 'cal-new': newModal({ date: el.dataset.date, time: el.dataset.time }); break;
    case 'new-save': {
      const v = id => ($('#' + id) || {}).value || '', err = [];
      if (!v('n-first').trim()) err.push('first name'); if (digits(v('n-phone')).length < 10) err.push('a 10-digit phone'); if (!v('n-time')) err.push('a free time');
      if (err.length) { $('#n-err').textContent = 'Please add ' + err.join(', ') + '.'; return; }
      const vt = vtById(v('n-vt'));
      const a = { id: uid('a_'), ref: makeRef(), createdAt: stamp(), source: v('n-src'), status: 'confirmed', visitTypeId: vt.id, doctorId: v('n-doc'), date: v('n-date'), time: v('n-time'), duration: vt.duration,
        patient: { first: v('n-first').trim(), last: v('n-last').trim(), phone: fmtPhone(v('n-phone')), email: v('n-email').trim(), returning: v('n-ret') === 'yes', sms: v('n-sms') === 'yes' }, note: '', history: [{ at: stamp(), text: `Added by ${u.name} (${SOURCES[v('n-src')]})` }] };

    case 'add-vt': DB.visitTypes.push({ id: uid('v_'), name: 'New visit type', duration: 30, active: false }); save(); refresh(); break;
    case 'save-s': $$('[data-s]').forEach(x => { const k = x.dataset.s; DB.settings[k] = x.type === 'checkbox' ? x.checked : ['slotInterval', 'leadHours', 'maxDays'].includes(k) ? +x.value : x.value.trim(); }); log(u.name, 'Changed settings', ''); save(); renderAdmin(); toast('Settings saved'); break;
    case 'save-r': $$('[data-r]').forEach(x => DB.settings.retention[x.dataset.r] = +x.value); log(u.name, 'Changed deletion schedule', `${DB.settings.retention.inactiveDays} / ${DB.settings.retention.completedDays} days`); save(); toast('Deletion schedule saved'); break;

    case 'closed-add': { const d = $('#cl-d').value; if (!d) return toast('Pick a date'); if (!DB.settings.closedDates.some(c => c.date === d)) DB.settings.closedDates.push({ date: d, label: $('#cl-l').value.trim() }); log(u.name, 'Added closed day', d); save(); refresh(); break; }

  const f = e.target.dataset.form; if (!f) return; e.preventDefault();
  if (f === 'book') bookSubmit();
  if (f === 'route') { const from = e.target.from.value.trim(); window.open(`https://www.google.com/maps/dir/?api=1${from ? '&origin=' + encodeURIComponent(from) : ''}&destination=${mq()}`, '_blank', 'noopener'); }
}
function onKey(e) {
  if (e.key === 'Escape' && layer().innerHTML) { closeLayer(); if (isAdmin()) refresh(); return; }
  if (e.key === 'Enter' && e.target.matches('tr[data-act], li[data-act], .cal__appt')) e.target.click();
}

/* ============ router ============ */
function route() {
  closeLayer();
  const h = location.hash;
  if (h.startsWith('#/admin')) { const v = h.split('/')[2] || 'today'; AV.view = v; renderAdmin(); }
  else if (h.startsWith('#/book')) { const q = Object.fromEntries(new URLSearchParams(h.split('?')[1] || '')); newBooking({ d: /^\d{4}-\d{2}-\d{2}$/.test(q.d || '') ? q.d : '', t: /^\d{2}:\d{2}$/.test(q.t || '') ? q.t : '' }); renderBook(); }
  else renderHome();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
window.addEventListener('storage', e => {
  if (e.key !== KEY || !e.newValue) return;
  const before = new Set(DB.appointments.map(a => a.id)); DB = migrate(JSON.parse(e.newValue)); MEM = e.newValue;
  const added = DB.appointments.filter(a => !before.has(a.id));
  if (isAdmin() && me()) { if (!layer().innerHTML) refresh(); refreshCount(); added.forEach(a => toast(`New ${SOURCES[a.source].toLowerCase()} request for ${fmtDate(a.date)} ${fmtTime(a.time)}`)); }
  else if (!location.hash.startsWith('#/book')) renderHome();
});
document.addEventListener('click', onClick); document.addEventListener('input', onInput); document.addEventListener('change', onChange); document.addEventListener('submit', onSubmit); document.addEventListener('keydown', onKey);
setInterval(() => { const s = $('.state'); if (s) { const st = openState(); s.className = 'state ' + (st.open ? 'is-open' : ''); s.lastChild.textContent = st.text; } }, 60000);
if (runRetention()) save();
route();
})();

</script>
</body>
