:root{
  --ink:#12424F; --ink-2:#1B5565; --ink-3:#2C6E80;
  --paper:#FFFFFF; --haze:#F1F5F5; --oat:#F4EFE7; --line:#DDE5E6; --line-2:#C5D2D5;
  --muted:#51666D; --on-ink:#C5D6DA;
  --mint:#8FE0C4; --mint-2:#79D4B5; --mint-soft:#E3F6EE; --mint-ink:#0C6A55;
  --amber:#8A5A00; --amber-soft:#FBEFD3; --green:#17694F; --green-soft:#DDF3E9;
  --red:#A8323E; --red-soft:#F8E1E3; --blue:#2A5B8C; --blue-soft:#E1ECF5;
  --serif:"Hedvig Serif", Georgia, "Times New Roman", serif;
  --sans:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --shadow:0 18px 44px rgba(18,66,79,.14);
  --wrap:1200px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:96px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;font-family:var(--sans);font-size:17px;line-height:1.6;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:3px solid var(--ink-3);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:var(--wrap);margin-left:auto;margin-right:auto;padding-left:32px;padding-right:32px}
[hidden]{display:none!important}
.muted{color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 26px;border-radius:999px;border:1.5px solid transparent;font-weight:600;font-size:16px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.btn--mint{background:var(--mint);color:var(--ink)}
.btn--mint:hover{background:var(--mint-2)}
.btn--ink{background:var(--ink);color:#fff}
.btn--ink:hover{background:var(--ink-2)}
.btn--line{background:transparent;border-color:var(--line-2);color:var(--ink)}
.btn--line:hover{border-color:var(--ink)}
.btn--onink{background:transparent;border-color:rgba(255,255,255,.45);color:#fff}
.btn--onink:hover{border-color:#fff}
.btn--sm{min-height:38px;padding:0 16px;font-size:14.5px}
.btn--danger{background:transparent;border-color:var(--red);color:var(--red)}
.btn--danger:hover{background:var(--red-soft)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:inherit}
.chip{display:inline-flex;align-items:center;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:14.5px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.chip:hover{border-color:var(--ink);background:var(--mint-soft)}

/* demo band */
.demo-band{background:var(--oat);font-size:13.5px;text-align:center;padding:7px 16px;color:var(--muted)}
.demo-band b{color:var(--ink);font-weight:600}

/* header */
.head{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.head__in{display:flex;align-items:center;gap:32px;height:78px}
.logo{display:flex;flex-direction:column;line-height:1.05;text-decoration:none}
.logo b{font-family:var(--serif);font-weight:400;font-size:26px;letter-spacing:-.01em}
.logo span{font-size:12.5px;color:var(--muted);margin-top:3px}
.nav{display:flex;gap:30px;margin-left:auto}
.nav a{text-decoration:none;font-weight:500;font-size:15.5px}
.nav a:hover{text-decoration:underline;text-underline-offset:6px;text-decoration-color:var(--mint-2);text-decoration-thickness:2px}
.head__tel{font-weight:600;text-decoration:none;font-size:15.5px;white-space:nowrap}
.menu-btn{display:none;margin-left:auto;background:none;border:0;padding:10px;cursor:pointer}
.menu-btn span{display:block;width:22px;height:2px;background:var(--ink);margin:5px 0}

/* hero */
.hero{padding:64px 0 0}
.hero__grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:72px;align-items:center}
.state{display:inline-flex;gap:9px;align-items:center;font-size:15px;font-weight:500;color:var(--muted);margin-bottom:24px}
.state i{width:9px;height:9px;border-radius:50%;background:var(--line-2)}
.state.is-open i{background:#2FA57B;box-shadow:0 0 0 4px var(--mint-soft)}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(42px,5vw,68px);line-height:1.02;letter-spacing:-.02em;margin-bottom:26px}
.lede{font-size:19px;color:var(--muted);max-width:44ch;margin-bottom:32px}
.hero__cta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:28px}
.rating{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--muted);text-decoration:none}
.rating b{color:var(--ink);font-weight:600}
.stars{display:inline-flex;gap:2px;color:var(--ink)}
.stars svg{width:16px;height:16px}
.hero__fig{position:relative;margin:0}
.hero__img{aspect-ratio:5/6;border-radius:32px;overflow:hidden;background:var(--haze)}
.hero__img img{width:100%;height:100%;object-fit:cover}
.hero__tag{position:absolute;top:20px;right:20px;background:var(--mint);color:var(--ink);font-size:13.5px;font-weight:600;padding:7px 14px;border-radius:999px}
.nextcard{position:absolute;left:-36px;bottom:36px;background:#fff;border-radius:20px;padding:18px 20px;box-shadow:var(--shadow);min-width:240px}
.nextcard small{display:block;color:var(--muted);font-size:13.5px}
.nextcard b{display:block;font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.25;margin:2px 0 8px}
.nextcard a{font-weight:600;font-size:14.5px;text-underline-offset:4px;text-decoration-color:var(--mint-2);text-decoration-thickness:2px}

.finder{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:56px;padding:20px 24px;border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:0 8px 28px rgba(18,66,79,.06)}
.finder__label{font-family:var(--serif);font-size:22px;white-space:nowrap}
.finder select{min-height:46px;border-radius:999px;border:1.5px solid var(--line-2);background:#fff;padding:0 18px;font-weight:600;font-size:15px}
.finder__slots{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.finder__all{font-weight:600;font-size:15px;white-space:nowrap;text-underline-offset:4px}
.trust{list-style:none;padding:0;margin:44px 0 0;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.trust li{padding:22px 24px 0 0}
.trust b{display:block;font-weight:600}
.trust span{font-size:14.5px;color:var(--muted)}

/* sections */
.sec{padding:112px 0}
.sec--oat{background:var(--oat)}
.sec--haze{background:var(--haze)}
.sec__head{max-width:640px;margin-bottom:64px}
.sec h2,.h2{font-family:var(--serif);font-weight:400;font-size:clamp(34px,3.8vw,52px);line-height:1.08;letter-spacing:-.015em;margin-bottom:16px}
.sec__head p{font-size:18px;color:var(--muted)}

.care__row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:80px;align-items:center;margin-bottom:96px}
.care__row:last-child{margin-bottom:0}
.care__row:nth-child(even) .care__img{order:2}
.care__img{aspect-ratio:4/3;border-radius:28px;overflow:hidden;background:var(--haze)}
.care__img img{width:100%;height:100%;object-fit:cover}
.care__body h3{font-family:var(--serif);font-weight:400;font-size:36px;line-height:1.1;margin-bottom:14px}
.care__body p{color:var(--muted);max-width:48ch;margin-bottom:20px}
.ticks{list-style:none;padding:0;margin:0 0 26px;display:grid;gap:10px}
.ticks li{position:relative;padding-left:30px;font-weight:500}
.ticks li::before{content:"";position:absolute;left:0;top:5px;width:18px;height:18px;border-radius:50%;background:var(--mint)}
.ticks li::after{content:"";position:absolute;left:5.5px;top:10px;width:7px;height:4px;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(-45deg)}

.about__grid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:80px;align-items:start}
.about__panel{position:sticky;top:112px;background:var(--ink);color:#fff;border-radius:32px;min-height:500px;padding:44px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.about__panel.has-photo{padding:0}
.about__panel img{width:100%;height:100%;min-height:500px;object-fit:cover}
.about__mark{width:44px;height:44px;border-radius:50%;background:var(--mint)}
.about__say{font-family:var(--serif);font-size:44px;line-height:1.08;letter-spacing:-.015em}
.about__who b{display:block;font-weight:600}
.about__who span{color:var(--on-ink);font-size:15px}
.about__body .big{font-size:21px;line-height:1.5;margin-bottom:18px}
.about__body p{color:var(--muted);max-width:60ch}
.about__body .big{color:var(--ink)}
.about__body h3{font-family:var(--serif);font-weight:400;font-size:26px;margin:44px 0 6px}
.pairs{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
.pairs li{padding:18px 0;border-bottom:1px solid var(--line-2)}
.pairs b{display:block;font-weight:600}
.pairs span{color:var(--muted);font-size:15.5px}

.reviews{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,2fr);gap:64px;align-items:start}
.reviews__score b{display:block;font-family:var(--serif);font-weight:400;font-size:96px;line-height:1;letter-spacing:-.03em}
.reviews__score .stars{margin:10px 0 8px}
.reviews__score .stars svg{width:20px;height:20px}
.reviews__score p{color:var(--muted);font-size:15.5px}
.reviews__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.reviews__grid div{padding:4px 28px 4px 28px;border-left:1px solid var(--line-2)}
.reviews__grid h3{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.2;margin-bottom:10px}
.reviews__grid p{color:var(--muted);font-size:16px}
.reviews__note{grid-column:1 / -1;font-size:14px;color:var(--muted);margin-top:28px;padding-left:28px}

.steps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:32px;counter-reset:s}
.steps li{counter-increment:s;border-top:1.5px solid var(--ink);padding-top:20px}
.steps li::before{content:counter(s);display:block;font-family:var(--serif);font-size:40px;line-height:1;margin-bottom:14px}
.steps b{display:block;font-weight:600;margin-bottom:4px}
.steps span{color:var(--muted);font-size:15.5px}

.visit__grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:56px}
.map{border-radius:28px;overflow:hidden;border:1px solid var(--line);background:var(--haze);min-height:440px;position:relative}
.map::before{content:attr(data-empty);position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}
.map iframe{position:relative;width:100%;height:100%;min-height:440px;border:0;display:block}
.route{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.route input{flex:1 1 240px;min-height:50px;border-radius:999px;border:1.5px solid var(--line-2);background:#fff;padding:0 22px}
.route input:focus{border-color:var(--ink);outline:none}
.vinfo h3{font-weight:600;font-size:17px;margin-bottom:8px}
.vinfo address{font-style:normal;margin-bottom:16px}
.vinfo .btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:36px}
.hours{width:100%;border-collapse:collapse;margin-bottom:30px}
.hours td{padding:10px 0;border-bottom:1px solid var(--line)}
.hours td:last-child{text-align:right}
.hours tr.is-today td{font-weight:600}
.hours tr.is-today td:first-child::after{content:attr(data-today);margin-left:10px;font-size:12.5px;font-weight:600;background:var(--mint);padding:2px 9px;border-radius:999px}
.notes{list-style:none;padding:0;margin:0}
.notes li{padding:10px 0;border-bottom:1px solid var(--line);font-size:15.5px;color:var(--muted)}
.notes b{display:block;color:var(--ink);font-weight:600}

.faq__grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:72px}
details.q{border-bottom:1px solid var(--line-2)}
details.q summary{list-style:none;cursor:pointer;padding:24px 44px 24px 0;font-family:var(--serif);font-size:22px;position:relative}
details.q summary::-webkit-details-marker{display:none}
details.q summary::after{content:"+";position:absolute;right:4px;top:18px;font-family:var(--sans);font-size:28px;font-weight:400;color:var(--muted)}
details.q[open] summary::after{content:"–"}
details.q p{margin:0 0 24px;color:var(--muted);max-width:60ch}

.band{position:relative;border-radius:36px;overflow:hidden;background:var(--ink);color:#fff;padding:88px 64px;display:flex;justify-content:space-between;align-items:center;gap:32px;flex-wrap:wrap}
.band img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.22}
.band > *:not(img){position:relative}
.band h2{font-family:var(--serif);font-weight:400;font-size:clamp(32px,3.8vw,52px);line-height:1.08;max-width:16ch;margin:0}
.band__cta{display:flex;gap:12px;flex-wrap:wrap}

.foot{padding:72px 0 32px;font-size:15px;color:var(--muted)}
.foot__grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:40px}
.foot b{color:var(--ink);display:block;margin-bottom:8px;font-weight:600}
.foot .logo b{font-weight:400;margin:0}
.foot__base{margin-top:52px;padding-top:22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13.5px}

/* booking */
.bk{background:var(--haze);min-height:calc(100vh - 110px);padding:48px 0 96px}
.bk__grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px;align-items:start;max-width:1040px}
.bk__card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:36px 40px 32px}
.bk__steps{display:flex;gap:8px;list-style:none;padding:0;margin:0 0 30px}
.bk__steps li{flex:1;font-size:13.5px;color:var(--muted);font-weight:500;padding-top:10px;border-top:3px solid var(--line)}
.bk__steps li.is-done{border-top-color:var(--mint-2);color:var(--ink)}
.bk__steps li.is-now{border-top-color:var(--ink);color:var(--ink);font-weight:600}
.bk__card h1{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.1;margin-bottom:6px}
.bk__card .sub{color:var(--muted);margin-bottom:26px}
.types{display:grid;gap:10px}
.type{display:grid;grid-template-columns:1fr auto;gap:2px 16px;text-align:left;padding:18px 20px;border:1.5px solid var(--line);border-radius:18px;background:#fff;cursor:pointer}
.type b{font-weight:600;font-size:17px}
.type span{grid-column:1;color:var(--muted);font-size:14.5px}
.type i{grid-row:1 / span 2;grid-column:2;align-self:center;font-style:normal;font-size:14px;color:var(--muted)}
.type:hover{border-color:var(--ink-3)}
.type.is-on{border-color:var(--ink);background:var(--mint-soft)}
.dates{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:18px;scroll-snap-type:x mandatory}
.date{flex:none;width:70px;padding:10px 0;border-radius:16px;border:1.5px solid var(--line);background:#fff;cursor:pointer;text-align:center;scroll-snap-align:start}
.date small{display:block;font-size:12.5px;color:var(--muted)}
.date b{display:block;font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.25}
.date.is-on{background:var(--ink);border-color:var(--ink);color:#fff}
.date.is-on small{color:var(--on-ink)}
.date:disabled{opacity:.35;cursor:not-allowed;background:var(--haze)}
.slot-group{font-size:13.5px;font-weight:600;color:var(--muted);margin:6px 0 8px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-bottom:14px}
.slot{padding:12px 0;border-radius:999px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-weight:600;font-size:15px}
.slot:hover{border-color:var(--ink)}
.slot.is-on{background:var(--mint);border-color:var(--mint)}
.empty{padding:20px;border-radius:16px;background:var(--haze);color:var(--muted);font-size:15.5px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label,.field .lab{font-weight:600;font-size:15px}
.field .help{font-size:13.5px;color:var(--muted);font-weight:400}
.field input[type=text],.field input[type=tel],.field input[type=email],.field input[type=date],.field input[type=time],.field input[type=search],.field select,.field textarea{min-height:48px;border-radius:12px;border:1.5px solid var(--line-2);background:#fff;padding:10px 14px;font-size:16px;width:100%}
.field textarea{min-height:84px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px var(--mint-soft)}
.field.has-err input{border-color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px}
.seg2{display:inline-flex;gap:8px;flex-wrap:wrap}
.seg2 button{padding:10px 18px;border-radius:999px;border:1.5px solid var(--line-2);background:#fff;cursor:pointer;font-weight:600;font-size:15px}
.seg2 button.is-on{background:var(--ink);border-color:var(--ink);color:#fff}
.check{display:flex;gap:12px;align-items:flex-start;font-size:15px;cursor:pointer;margin-bottom:10px}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--ink);flex:none}
.bk__nav{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}
.err{color:var(--red);font-weight:500;font-size:15px}
.sum{background:#fff;border:1px solid var(--line);border-radius:24px;padding:26px;position:sticky;top:106px}
.sum h2{font-family:var(--serif);font-weight:400;font-size:22px;margin-bottom:10px}
.sum dl{margin:0}
.sum dt{font-size:13.5px;color:var(--muted);margin-top:14px}
.sum dd{margin:0;font-weight:600}
.sum dd.is-empty{font-weight:400;color:var(--muted)}
.sum__note{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.done__tick{width:60px;height:60px;border-radius:50%;background:var(--mint);display:grid;place-items:center;margin-bottom:20px}
.ref{font-weight:700;letter-spacing:.06em;background:var(--haze);padding:3px 10px;border-radius:8px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

@media (max-width:1000px){
  .hero__grid,.care__row,.about__grid,.visit__grid,.faq__grid,.reviews,.bk__grid{grid-template-columns:minmax(0,1fr);gap:40px}
  .care__row:nth-child(even) .care__img{order:0}
  .about__panel,.sum{position:static}
  .about__panel{min-height:340px}
  .about__panel img{min-height:340px}
  .nextcard{left:16px;bottom:16px}
  .hero__img{aspect-ratio:4/3}
  .trust{grid-template-columns:1fr 1fr}
  .steps{grid-template-columns:1fr 1fr}
  .reviews__grid{grid-template-columns:1fr}
  .reviews__grid div{border-left:0;border-top:1px solid var(--line-2);padding:22px 0}
  .reviews__note{padding-left:0}
  .foot__grid{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  body{font-size:16px}
  .wrap{padding-left:20px;padding-right:20px}
  .nav,.head__tel,.head .btn{display:none}
  .menu-btn{display:block}
  .head.open .nav{display:flex;position:absolute;top:78px;left:0;right:0;flex-direction:column;gap:0;background:#fff;border-bottom:1px solid var(--line);padding:6px 20px 16px}
  .head.open .nav a{padding:13px 0;border-bottom:1px solid var(--line)}
  .hero{padding-top:36px}
  .finder{margin-top:36px;padding:18px}
  .finder select{width:100%}
  .finder__slots{flex:1 1 100%}
  .sec{padding:76px 0}
  .sec__head{margin-bottom:40px}
  .care__row{margin-bottom:64px}
  .pairs,.grid2,.grid3,.steps{grid-template-columns:1fr}
  .about__say{font-size:34px}
  .band{padding:56px 28px;border-radius:28px}
  .bk{padding-top:24px}
  .bk__card{padding:24px 20px}
  .foot__grid{grid-template-columns:1fr}
}

/* ================= PANEL ================= */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh;background:var(--haze);font-size:15px}
.side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:24px 14px 18px;position:sticky;top:0;height:100vh}
.side .logo{padding:0 10px 26px}
.side .logo b{font-size:23px}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;text-decoration:none;font-weight:500;color:var(--muted)}
.side nav a:hover{background:var(--haze);color:var(--ink)}
.side nav a.is-on{background:var(--haze);color:var(--ink);font-weight:600}
.side nav svg{width:19px;height:19px;flex:none}
.count{margin-left:auto;background:var(--mint);color:var(--ink);font-size:12.5px;font-weight:700;padding:1px 9px;border-radius:999px}
.side__foot{margin-top:auto;padding:16px 10px 0;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted)}
.side__foot b{display:block;color:var(--ink);font-weight:600;font-size:14.5px}
.side__foot p{margin:0 0 10px}
.side__demo{display:inline-block;margin-top:12px;font-size:12.5px;background:var(--oat);padding:3px 10px;border-radius:999px}
.main{min-width:0}
.page-head{display:flex;align-items:center;gap:16px;padding:30px 40px 0;max-width:1280px}
.page-head h1{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.1;margin-right:auto}
.side-toggle{display:none;background:none;border:0;padding:6px;cursor:pointer}
.content{padding:24px 40px 72px;max-width:1280px}

.daynav{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.daynav h2{font-weight:600;font-size:18px}
.daynav__ctl{display:flex;gap:8px;align-items:center}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line-2);background:#fff;cursor:pointer;font-size:18px;line-height:1}
.iconbtn:hover{border-color:var(--ink)}
.seg{display:inline-flex;background:#fff;border:1.5px solid var(--line-2);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 16px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.is-on{background:var(--ink);color:#fff}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:20px}
.wday{background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px 4px 10px;text-align:center;cursor:pointer}
.wday small{display:block;font-size:12.5px;color:var(--muted)}
.wday b{display:block;font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.2}
.wday i{display:block;font-style:normal;font-size:12.5px;color:var(--muted)}
.wday:hover{border-color:var(--ink-3)}
.wday.is-closed{background:transparent;border-style:dashed}
.wday.is-today b{text-decoration:underline;text-decoration-color:var(--mint-2);text-decoration-thickness:3px;text-underline-offset:5px}
.wday.is-on{background:var(--ink);border-color:var(--ink);color:#fff}
.wday.is-on small,.wday.is-on i{color:var(--on-ink)}
.sch{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;margin-bottom:20px;min-width:0}
.card__head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line)}
.card__head h3{font-size:16px;font-weight:600}
.card__head span{font-size:13.5px;color:var(--muted)}
.card__body{padding:18px 22px}
.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:86px 4px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:14px 22px;border-bottom:1px solid var(--haze);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:#FAFCFC}
.row time{font-weight:600}
.row time small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.row__bar{align-self:stretch;border-radius:4px}
.row__who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row__who span{font-size:13.5px;color:var(--muted)}
.none{padding:36px 22px;text-align:center;color:var(--muted)}
.none b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}
.open{padding:16px 22px;border-top:1px solid var(--line)}
.open p{font-size:13.5px;color:var(--muted);margin-bottom:10px}
.open div{display:flex;gap:6px;flex-wrap:wrap}
.open .chip{padding:6px 12px;font-size:13.5px}
.req{padding:16px 20px;border-bottom:1px solid var(--haze)}
.req:last-child{border-bottom:0}
.req b{display:block;font-weight:600}
.req span{display:block;font-size:13.5px;color:var(--muted)}
.req__act{display:flex;gap:8px;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stat{padding:16px 0 16px 20px;border-left:1px solid var(--haze)}
.stat:first-child{border-left:0}
.stat b{display:block;font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.st-requested{background:var(--amber-soft);color:var(--amber)}
.st-confirmed{background:var(--green-soft);color:var(--green)}
.st-checked_in{background:var(--blue-soft);color:var(--blue)}
.st-completed{background:var(--haze);color:var(--muted)}
.st-cancelled,.st-no_show{background:var(--red-soft);color:var(--red)}

.cal{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}
.cal__head{display:grid;border-bottom:1px solid var(--line)}
.cal__head div{padding:10px;font-size:13.5px;font-weight:600;text-align:center;border-left:1px solid var(--haze)}
.cal__head div:first-child{border-left:0}
.cal__head .is-today{background:var(--mint-soft)}
.cal__head small{display:block;font-weight:400;color:var(--muted)}
.cal__body{display:grid;position:relative}
.cal__times div{height:48px;font-size:12px;color:var(--muted);text-align:right;padding:2px 8px 0 0;border-top:1px solid var(--haze)}
.cal__day{position:relative;border-left:1px solid var(--haze)}
.cal__day.is-closed{background:repeating-linear-gradient(135deg,#F8FAFA 0 8px,#F1F5F5 8px 16px)}
.cal__slot{height:24px;border-top:1px solid var(--haze)}
.cal__slot:nth-child(2n){border-top-color:transparent}
.cal__slot.can{cursor:copy}
.cal__slot.can:hover{background:var(--mint-soft)}
.cal__appt{position:absolute;left:3px;right:3px;border-radius:8px;padding:4px 8px;font-size:12px;line-height:1.25;overflow:hidden;cursor:pointer;border-left:4px solid;background:var(--haze)}
.cal__appt b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal__appt.is-off{opacity:.45;text-decoration:line-through}
.cal__appt.is-req{background:var(--amber-soft)}
.cal__now{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:2}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar select,.toolbar input[type=search]{min-height:40px;border-radius:999px;border:1.5px solid var(--line-2);background:#fff;padding:0 16px;font-size:14.5px}
.toolbar input[type=search]{width:260px}
.table-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-weight:600;font-size:13px;color:var(--muted);padding:13px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:13px 18px;border-bottom:1px solid var(--haze);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr[data-act]{cursor:pointer}
.tbl tbody tr[data-act]:hover{background:#FAFCFC}
.tbl b{font-weight:600}
.tbl .sub{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-2);margin-bottom:22px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 16px;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.is-on{color:var(--ink);border-bottom-color:var(--ink)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}

.scrim{position:fixed;inset:0;background:rgba(10,40,48,.4);z-index:80;animation:fade .15s}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(12px);opacity:0}}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
.drawer{position:fixed;top:12px;right:12px;bottom:12px;width:min(480px,calc(100% - 24px));background:#fff;border-radius:24px;z-index:81;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(10,40,48,.28);animation:slide .2s ease;overflow:hidden}
.drawer__head{padding:22px 26px 20px;border-bottom:1px solid var(--line)}
.drawer__top{display:flex;justify-content:space-between;align-items:center}
.drawer__head h2{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.15;margin:10px 0 2px}
.drawer__head p{color:var(--muted)}
.drawer__actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.drawer__body{padding:20px 26px 32px;overflow-y:auto;flex:1}
.x{background:none;border:0;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:24px;line-height:1;color:var(--muted)}
.x:hover{background:var(--haze);color:var(--ink)}
.kv{display:grid;grid-template-columns:130px 1fr;margin:0 0 18px}
.kv dt,.kv dd{margin:0;padding:10px 0;border-bottom:1px solid var(--haze);font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{font-weight:500}
.fold{border:1px solid var(--line);border-radius:14px;margin-top:10px}
.fold summary{cursor:pointer;padding:13px 16px;font-weight:600;list-style:none;position:relative}
.fold summary::-webkit-details-marker{display:none}
.fold summary::after{content:"+";position:absolute;right:16px;top:9px;font-size:22px;font-weight:400;color:var(--muted)}
.fold[open] summary::after{content:"–"}
.fold__in{padding:4px 16px 16px}
.statusbar{display:flex;flex-wrap:wrap;gap:6px}
.statusbar button{border:1.5px solid var(--line-2);background:#fff;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer}
.statusbar button:hover{border-color:var(--ink)}
.statusbar button.is-on{background:var(--ink);border-color:var(--ink);color:#fff}
.statusbar button:disabled{opacity:.4;cursor:not-allowed}
.retain{font-size:14px;color:var(--muted);background:var(--haze);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.retain b{color:var(--ink)}
.timeline{list-style:none;padding:0;margin:0 0 14px;font-size:13.5px;color:var(--muted)}
.timeline li{padding:4px 0}
.modal{position:fixed;z-index:90;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;pointer-events:none}
.modal__card{pointer-events:auto;background:#fff;width:min(660px,100%);max-height:calc(100vh - 48px);border-radius:24px;display:flex;flex-direction:column;overflow:hidden;animation:rise .2s ease;box-shadow:0 30px 80px rgba(10,40,48,.3)}
.modal__head{display:flex;justify-content:space-between;align-items:center;padding:20px 26px;border-bottom:1px solid var(--line)}
.modal__head h2{font-family:var(--serif);font-weight:400;font-size:26px}
.modal__body{padding:22px 26px;overflow-y:auto}
.modal__foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 26px;border-top:1px solid var(--line)}
.modal__foot .left{margin-right:auto}

.doctors{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.dcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}
.dcard__top{display:flex;gap:14px;align-items:center}
.avatar{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;overflow:hidden;flex:none;font-size:17px}
.avatar img{width:100%;height:100%;object-fit:cover}
.dcard h3{font-size:17px;font-weight:600}
.dcard p{color:var(--muted);font-size:14px}
.sched{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.sched span{text-align:center;font-size:12px;padding:6px 0;border-radius:8px;background:var(--haze);color:var(--muted)}
.sched span.on{background:var(--mint-soft);color:var(--mint-ink);font-weight:600}
.add-card{border:1.5px dashed var(--line-2);background:transparent;border-radius:18px;min-height:190px;display:grid;place-items:center;cursor:pointer;font-weight:600;color:var(--muted)}
.add-card:hover{border-color:var(--ink);color:var(--ink)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line-2);cursor:pointer}
.swatch.is-on{box-shadow:0 0 0 2.5px var(--ink)}
.week-edit{display:grid;grid-template-columns:110px 54px 1fr 1fr;gap:8px 12px;align-items:center;font-size:15px}
.week-edit input[type=time]{min-height:40px;border-radius:10px;border:1.5px solid var(--line-2);background:#fff;padding:0 10px}
.week-edit input[type=time]:disabled{opacity:.4}
.switch{position:relative;width:44px;height:26px;flex:none;display:inline-block}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line-2);cursor:pointer;transition:background .15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked + span{background:var(--ink)}
.switch input:checked + span::after{transform:translateX(18px)}
.switch input:focus-visible + span{outline:3px solid var(--ink-3);outline-offset:2px}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--haze)}
.swrow:last-of-type{border-bottom:0}
.swrow b{display:block;font-weight:600}
.swrow small{color:var(--muted);font-size:13.5px}
.vt-row{display:grid;grid-template-columns:1fr 130px 54px;gap:10px;align-items:center;padding:8px 0}
.vt-row input,.vt-row select{min-height:42px;border-radius:10px;border:1.5px solid var(--line-2);background:#fff;padding:0 12px;width:100%}
.data-list{margin:0;padding:0;list-style:none}
.data-list li{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--haze)}
.data-list li span:last-child{color:var(--muted);text-align:right}
.closed-list{list-style:none;padding:0;margin:0 0 14px}
.closed-list li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--haze)}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.inline .field{margin-bottom:0;flex:1 1 140px}
.hint{font-size:13.5px;color:var(--muted);margin-top:12px}

.login{min-height:100vh;display:grid;place-items:center;background:var(--haze);padding:32px 20px}
.login__box{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:40px}
.login__box h1{font-family:var(--serif);font-weight:400;font-size:34px;margin:26px 0 6px}
.who{display:flex;flex-direction:column;gap:10px;margin:24px 0}
.who button{display:flex;gap:14px;align-items:center;text-align:left;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:#fff;cursor:pointer}
.who button:hover{border-color:var(--ink);background:var(--mint-soft)}
.who b{display:block;font-weight:600}
.who small{color:var(--muted);font-size:13.5px}
.toasts{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.toast{background:var(--ink);color:#fff;padding:13px 20px;border-radius:14px;font-size:14.5px;box-shadow:0 12px 30px rgba(10,40,48,.25);animation:rise .2s ease;max-width:380px}

@media (max-width:1100px){.sch,.cols2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:60;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  .app.side-open .side{transform:none}
  .side-toggle{display:block}
  .page-head{padding:18px 16px 0}
  .page-head h1{font-size:26px}
  .content{padding:18px 16px 64px}
  .weekstrip{gap:4px}
  .wday i{display:none}
  .wday b{font-size:20px}
  .row{grid-template-columns:72px 4px auto minmax(0,1fr);row-gap:10px;padding:14px 16px}
  .row time{grid-column:1;grid-row:1}
  .row__bar{grid-column:2;grid-row:1 / span 2}
  .row__who{grid-column:3 / -1;grid-row:1}
  .row .badge{grid-column:3;grid-row:2;justify-self:start;align-self:center}
  .row .btn{grid-column:4;grid-row:2;justify-self:start}
  .row > span:empty:not(.row__bar){display:none}
  .toolbar input[type=search]{width:100%}
  .week-edit{grid-template-columns:92px 50px 1fr 1fr}
  .login__box{padding:28px 22px}
}

/* ================= v4 additions ================= */
/* language switch */
.lang{display:inline-flex;border:1.5px solid var(--line-2);border-radius:999px;padding:3px;flex:none}
.lang button{border:0;background:none;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.02em;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.head__in{gap:24px}
.nav{gap:26px}
.more{font-weight:600;font-size:15.5px;text-underline-offset:4px;text-decoration-color:var(--mint-2);text-decoration-thickness:2px;margin-left:8px}
.ticks a{text-underline-offset:4px;text-decoration-color:var(--line-2)}
.ticks a:hover{text-decoration-color:var(--ink)}
.finder__note{flex:1 1 100%;font-size:15px;color:var(--muted);margin:-4px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.finder__note a{font-weight:600;color:var(--ink)}
.foot__grid{grid-template-columns:1.4fr 1.1fr 1fr 1fr 1.1fr}
.foot a{text-decoration-color:var(--line-2);text-underline-offset:3px}

/* mobile action bar */
.mbar{display:none}
@media (max-width:760px){
  .lang{margin-left:auto}
  .menu-btn{margin-left:4px}
  .mbar{display:flex;gap:10px;position:fixed;left:0;right:0;bottom:0;z-index:45;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
  .mbar .btn{flex:1;min-height:48px;padding:0 12px}
  .has-mbar ~ .foot{padding-bottom:110px}
  .toasts{bottom:86px}
}

/* care pages */
.svc-hero{padding:56px 0 8px}
.svc-hero__grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:64px;align-items:center}
.svc-hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(38px,4.4vw,60px);line-height:1.04;letter-spacing:-.02em;margin-bottom:20px}
.svc-hero__img{aspect-ratio:4/3;border-radius:28px;overflow:hidden;background:var(--haze)}
.svc-hero__img img{width:100%;height:100%;object-fit:cover}
.crumb{display:flex;gap:8px;font-size:14.5px;color:var(--muted);margin-bottom:22px}
.crumb a{color:var(--muted)}
.sec--tight{padding:72px 0 112px}
.svc{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:72px;align-items:start}
.svc__main{max-width:680px}
.svc__main h2{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.15;margin:52px 0 14px}
.svc__main h2:first-child,.svc__main .alert + h2{margin-top:0}
.svc__main > p{color:var(--muted);font-size:18px}
.vsteps{list-style:none;padding:0;margin:0;counter-reset:s}
.vsteps li{counter-increment:s;position:relative;padding:0 0 22px 56px}
.vsteps li::before{content:counter(s);position:absolute;left:0;top:-2px;width:36px;height:36px;border-radius:50%;background:var(--haze);display:grid;place-items:center;font-family:var(--serif);font-size:19px}
.vsteps li:not(:last-child)::after{content:"";position:absolute;left:17.5px;top:38px;bottom:4px;width:1px;background:var(--line-2)}
.vsteps b{display:block;font-weight:600}
.vsteps span{color:var(--muted)}
.alert{background:var(--red-soft);color:#6E1F28;border-radius:16px;padding:16px 20px;margin-bottom:36px;font-size:15.5px}
.alert b{color:var(--red)}
.svc__side{position:sticky;top:106px;display:grid;gap:20px}
.svc__side .sum{position:static}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.sum__btns{display:grid;gap:8px}
.svc__more{display:flex;flex-direction:column;gap:2px;padding:0 6px}
.svc__more b{font-weight:600;margin-bottom:6px}
.svc__more a{padding:6px 0;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}
.svc__more a:hover{color:var(--ink)}

/* booking: urgent */
.urgent{margin-top:18px;border:1.5px solid var(--ink);border-radius:20px;padding:22px 24px;background:var(--mint-soft)}
.urgent h2{font-family:var(--serif);font-weight:400;font-size:24px;margin-bottom:6px}
.urgent p{margin-bottom:16px}
.urgent__er{font-size:14px;color:var(--muted);margin:16px 0 0!important;padding-top:14px;border-top:1px solid rgba(18,66,79,.15)}
.hintbar{background:var(--mint-soft);border-radius:12px;padding:10px 16px;font-size:15px;margin:-10px 0 18px}
.hintbar a{font-weight:600}

/* change or cancel */
.mg{max-width:720px;margin:0 auto}
.mg__find{max-width:440px}
.mg__back{font-size:14.5px;color:var(--muted);margin-bottom:16px;display:inline-block}
.kv--site{margin:4px 0 22px}
.kv--site dd{font-weight:600}
.notice{background:var(--haze);border-radius:14px;padding:14px 18px;margin-bottom:18px;font-size:15.5px}
.notice b{display:block;font-weight:600}
.notice--wait{background:var(--amber-soft)}
.notice--ok{background:var(--green-soft)}
.demo-hint{margin-top:28px;padding:14px 18px;border:1.5px dashed var(--line-2);border-radius:14px;font-size:14.5px;color:var(--muted)}
.demo-hint b{color:var(--ink);font-weight:600;margin-right:6px}
.demo-hint code{font-family:inherit;font-weight:700;color:var(--ink);background:var(--haze);padding:2px 7px;border-radius:6px}

/* panel additions */
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--haze);color:var(--ink);white-space:nowrap;vertical-align:middle}
.tag--amber{background:var(--amber-soft);color:var(--amber)}
.tag--red{background:var(--red-soft);color:var(--red)}
.offbar{padding:12px 22px;background:repeating-linear-gradient(135deg,#F8FAFA 0 8px,#F1F5F5 8px 16px);border-bottom:1px solid var(--line);font-size:14.5px;color:var(--muted);border-radius:18px 18px 0 0}
.offbar b{color:var(--ink);font-weight:600;margin-right:4px}
.row--break{cursor:default;background:repeating-linear-gradient(135deg,#FBFCFC 0 8px,#F5F8F8 8px 16px)}
.row--break:hover{background:repeating-linear-gradient(135deg,#FBFCFC 0 8px,#F5F8F8 8px 16px)}
.row--break .row__bar{background:var(--line-2)}
.row--break .row__who b{font-weight:500;color:var(--muted)}
.req--chg{padding:14px 16px}
.req__kind{font-size:12.5px;font-weight:600;color:var(--amber);margin-bottom:6px}
.chg{border-radius:14px;padding:14px 16px;border:1.5px solid var(--line)}
.chg.is-ok{border-color:#BFE6D3;background:#F6FCF9}
.chg.is-bad{border-color:#EFC3C8;background:#FFF8F8}
.chg__who{display:block;font-weight:600;margin-bottom:4px}
.chg__move{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:15px}
.chg__move dt{color:var(--muted);font-size:13px;padding-top:2px}
.chg__move dd{margin:0}
.chg__move s{color:var(--muted);text-decoration-color:var(--line-2)}
.chg__move b{font-weight:600}
.chg__meta{font-size:13px;color:var(--muted);margin:2px 0 10px}
.chg__ok{font-size:14px;font-weight:600;color:var(--green)}
.chg__list{margin:0;padding-left:18px;font-size:14px;color:var(--red)}
.chg__list li{padding:2px 0}
.chg__list .linkbtn{color:var(--red)}
.chg__soft{font-size:13.5px;color:var(--amber);margin-top:6px}
.chg__alts{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.chg__alts p{font-size:13px;color:var(--muted);margin-bottom:8px}
.chg__alts div{display:flex;gap:6px;flex-wrap:wrap}
.chg__alts .chip{padding:6px 12px;font-size:13.5px}
.chg .req__act{margin-top:12px}
.reqcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.card__intro{padding:14px 22px 4px;font-size:14px;color:var(--muted)}
.mini{font-size:14px;font-weight:600;margin:0 0 10px}
.alert--panel{margin:0 0 18px;font-size:14.5px}
.alert--panel ul{margin:6px 0;padding-left:18px}
.cal__break{position:absolute;left:3px;right:3px;border-radius:8px;background:repeating-linear-gradient(135deg,#F3F6F6 0 6px,#E9EFEF 6px 12px);font-size:11.5px;color:var(--muted);padding:3px 8px;pointer-events:none}
.cal__offlabel{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:12.5px;font-weight:600;color:var(--muted);z-index:1}
.cal__appt.is-ghost{background:transparent;border:1.5px dashed var(--amber);color:var(--amber)}
.cal__appt.is-bad{background:var(--red-soft)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.tile b{display:block;font-family:var(--serif);font-weight:400;font-size:36px;line-height:1.1}
.tile span{display:block;font-weight:600;font-size:14px;margin-top:2px}
.tile small{display:block;font-size:13px;color:var(--muted)}
.bars{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.bars li{display:grid;grid-template-columns:150px minmax(0,1fr) 36px;gap:12px;align-items:center;font-size:14px}
.bars__track{height:12px;background:var(--haze);border-radius:999px;overflow:hidden}
.bars__track i{display:block;height:100%;background:var(--ink);border-radius:999px}
.bars li b{text-align:right;font-weight:600}
.dlist{list-style:none;margin:0;padding:0;font-size:14px;color:var(--muted)}
.dlist li{padding:5px 0;border-bottom:1px solid var(--haze)}
.dlist li:last-child{border-bottom:0}
.lunch{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lunch input[type=time]{min-height:40px;border-radius:10px;border:1.5px solid var(--line-2);background:#fff;padding:0 10px}
.daypick{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.daypick button{border:1.5px solid var(--line-2);background:#fff;border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.daypick button.is-on{background:var(--ink);border-color:var(--ink);color:#fff}
.phone{width:min(320px,100%);margin:0 auto 22px;background:linear-gradient(160deg,#1B5565,#12424F);border-radius:30px;padding:16px 14px 30px;min-height:210px}
.phone__bar{color:#fff;font-size:12.5px;font-weight:600;padding:0 10px 14px}
.push{background:rgba(255,255,255,.96);border-radius:18px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.push__top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px}
.push__app{font-weight:600;display:inline-flex;align-items:center;gap:6px}
.push__app::before{content:"";width:14px;height:14px;border-radius:4px;background:#2FA57B}
.push__app--whatsapp::before{background:#1E8E4F}
.push__app--email::before{background:var(--blue)}
.push b{display:block;font-size:14.5px}
.push p{font-size:14px;line-height:1.4}
.push small{display:block;margin-top:8px;font-size:11.5px;color:var(--muted)}
.pushmock{position:fixed;top:16px;right:16px;z-index:210;width:min(340px,calc(100% - 32px));animation:rise .25s ease;transition:opacity .4s,transform .4s}
.pushmock .push{box-shadow:0 18px 50px rgba(10,40,48,.3);border:1px solid var(--line)}
.pushmock.is-gone{opacity:0;transform:translateY(-10px);pointer-events:none}
.sent{list-style:none;margin:0;padding:0;font-size:14px}
.sent li{padding:9px 0;border-bottom:1px solid var(--haze)}
.sent li span{display:block;font-size:12.5px;color:var(--muted)}

@media (max-width:1100px){.reqcols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:1000px){
  .svc-hero__grid,.svc{grid-template-columns:minmax(0,1fr);gap:36px}
  .svc__side{position:static}
  .foot__grid{grid-template-columns:1fr 1fr}
}
@media (max-width:820px){
  .bars li{grid-template-columns:110px minmax(0,1fr) 30px}
  .daynav__ctl{flex-wrap:wrap}
}
@media (max-width:760px){
  .svc-hero{padding-top:28px}
  .sec--tight{padding:48px 0 76px}
  .svc__main h2{font-size:26px;margin-top:40px}
  .foot__grid{grid-template-columns:1fr}
}

/* print: today's list only */
.print-only{display:none}
@media print{
  @page{margin:14mm}
  body{background:#fff}
  body > *:not(#print){display:none!important}
  #print{display:block!important;font-family:var(--sans);color:#000;font-size:11pt}
  #print header b{font-family:var(--serif);font-size:14pt;font-weight:400}
  #print h1{font-family:var(--serif);font-weight:400;font-size:20pt;margin:2pt 0 4pt}
  #print header p{margin-bottom:10pt}
  #print table{width:100%;border-collapse:collapse}
  #print th{text-align:left;font-size:9pt;border-bottom:1.5pt solid #000;padding:5pt 6pt}
  #print td{border-bottom:.5pt solid #999;padding:7pt 6pt;vertical-align:top}
  #print td small{color:#444}
  #print td.box{width:40pt}
  #print td.box::before{content:"";display:inline-block;width:12pt;height:12pt;border:1pt solid #000}
  #print footer{margin-top:14pt;font-size:9pt;color:#333}
}

.req .tag{display:inline-flex;margin-left:6px}
.req__act{flex-wrap:wrap}
.chg__list .linkbtn{text-align:left}
html[lang="tr"] .hero h1{font-size:clamp(40px,4.6vw,62px)}

</style>

<body>
<div id="root"></div>
<div id="layer"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="print" class="print-only"></div>
<script>
(() => {
'use strict';

/* ============ basics ============ */
const TZ = 'America/Chicago';
const KEY = 'qbdental.demo.v4';
const USER_KEY = 'qbdental.v4.user';
const LANG_KEY = 'qbdental.lang';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => p + Math.random().toString(36).slice(2, 9);
const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const DAY3 = DAYS.map(d => d.slice(0, 3));
const WEEK = [1, 2, 3, 4, 5, 6, 0];

  const rows = DB.appointments.slice().sort(byWhen).map(a => [a.ref, a.date, a.time, a.duration, STATUS[a.status], SOURCES[a.source], (vtById(a.visitTypeId) || {}).name, (docById(a.doctorId) || {}).name, a.patient.first, a.patient.last, a.patient.phone, a.patient.email, a.patient.returning ? 'yes' : 'no', a.patient.sms ? 'yes' : 'no', a.patient.lang === 'tr' ? 'Turkish' : 'English', a.note].map(q).join(','));
  download(`qb-dental-appointments-${nowParts().date}.csv`, [cols.map(q).join(','), ...rows].join('\n'), 'text/csv');
  log(me().name, 'Exported appointments (CSV)', `${rows.length} rows`); save(); refresh(); toast(`Exported ${rows.length} rows. The export is in the activity log.`);
}
function printDay(d) {
  const u = me(), S = DB.settings, list = DB.appointments.filter(a => a.date === d && a.status !== 'cancelled').sort(byWhen), offs = DB.doctors.filter(x => x.active && offOn(x, d));
  const br = DB.doctors.filter(x => x.active && !offOn(x, d) && (x.schedule[dow(d)] || {}).on && lunchOn(x, d));
  $('#print').innerHTML = `<header><b>${esc(S.shortName)}</b><h1>${fmtLong(d)}</h1><p>${list.length} visit${list.length === 1 ? '' : 's'}${br.length ? `. Lunch ${br.map(x => `${fmtTime(x.lunch.start)} to ${fmtTime(x.lunch.end)}${multiDoc() ? ' (' + esc(x.name) + ')' : ''}`).join(', ')}` : ''}${offs.length ? `. Off today: ${offs.map(x => esc(x.name)).join(', ')}` : ''}.</p></header>
    <table><thead><tr><th>Time</th><th>Patient</th><th>Phone</th><th>Visit</th>${multiDoc() ? '<th>Doctor</th>' : ''}<th>Status</th><th>Note</th><th>Arrived</th></tr></thead><tbody>
    ${list.map(a => `<tr><td>${fmtTime(a.time)}<br><small>${a.duration} min</small></td><td><b>${esc(fullName(a.patient))}</b>${a.patient.returning ? '' : '<br><small>New patient</small>'}${a.patient.lang === 'tr' ? '<br><small>Turkish</small>' : ''}</td><td>${esc(a.patient.phone)}</td><td>${esc((vtById(a.visitTypeId) || {}).name || '')}</td>${multiDoc() ? `<td>${esc((docById(a.doctorId) || {}).name || '')}</td>` : ''}<td>${STATUS[a.status]}</td><td>${esc(a.note)}</td><td class="box"></td></tr>`).join('') || '<tr><td colspan="8">No visits booked.</td></tr>'}</tbody></table>
    <footer>Printed ${fmtStamp(stamp())} by ${esc(u.name)}. This page contains patient information. Keep it at the front desk and shred it at the end of the day.</footer>`;
  log(u.name, 'Printed day list', fmtDate(d)); save();
  window.print();
}
let PUSH_T = null;
function pushMock(x) {
  let el = $('#pushmock'); if (!el) { el = document.createElement('div'); el.id = 'pushmock'; document.body.appendChild(el); }
  el.className = 'pushmock'; el.innerHTML = `<div class="push"><div class="push__top"><span class="push__app push__app--${x.channel}">${{ sms: 'Messages', whatsapp: 'WhatsApp', email: 'Mail' }[x.channel]}</span><span>now</span></div><b>${esc(DB.settings.shortName)}</b><p>${esc(x.text)}</p><small>Demo: what the owner's phone would show</small></div>`;
  clearTimeout(PUSH_T); PUSH_T = setTimeout(() => { el.className = 'pushmock is-gone'; }, 7000);
}
function resize(file, cb) { const fr = new FileReader(); fr.onload = () => { const im = new Image(); im.onload = () => { const sc = Math.min(1, 900 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); cb(c.toDataURL('image/jpeg', .85)); }; im.src = fr.result; }; fr.readAsDataURL(file); }

/* ============ events ============ */
const isAdmin = () => location.hash.startsWith('#/admin');
const onHome = () => !location.hash || location.hash === '#' || location.hash === '#/';

}

    case 'mg-step': MG.step = el.dataset.v; MG.err = ''; if (MG.step === 'move') { MG.date = ''; MG.time = ''; } refreshManage(); window.scrollTo(0, 0); break;
    case 'mg-out': MG = { step: 'find', ref: '', phone: '', id: null, err: '', date: '', time: '', fails: MG.fails }; refreshManage(); break;
    case 'mg-date': { const sc = $('.dates').scrollLeft; MG.date = el.dataset.v; MG.time = ''; MG.err = ''; refreshManage(); $('.dates').scrollLeft = sc; break; }
    case 'mg-time': MG.time = el.dataset.v; MG.err = ''; $$('.slot').forEach(x => { x.classList.toggle('is-on', x === el); x.setAttribute('aria-pressed', x === el); }); $('#mg-err').textContent = ''; break;
    case 'mg-send': mgSend(); break;
    case 'mg-cancel': mgCancel(); break;
    case 'mg-withdraw': { const a = mgAppt(); if (a && a.change && a.change.status === 'pending') { a.change.status = 'withdrawn'; a.history.push({ at: stamp(), text: 'Patient withdrew the change request online' }); log('Patient (online)', 'Withdrew change request', a.ref); save(); } refreshManage(); break; }
    case 'login': setMe(el.dataset.id); log(DB.users.find(x => x.id === el.dataset.id).name, 'Signed in', ''); save(); AV.view = 'schedule'; if (location.hash !== '#/admin/schedule') location.hash = '#/admin/schedule'; else renderAdmin(); break;
    case 'logout': e.preventDefault(); log(u.name, 'Signed out', ''); save(); setMe(null); location.hash = '#/admin'; renderLogin(); break;
    case 'side-toggle': $('#app').classList.toggle('side-open'); break;
    case 'close': closeLayer(); if (isAdmin()) refresh(); break;
    case 'open': e.stopPropagation(); openAppt(el.dataset.id); break;

    case 'note': { const a = apById(el.dataset.id); a.note = $('#note').value.trim().slice(0, 120); a.history.push({ at: stamp(), text: `Note updated by ${u.name}` }); log(u.name, 'Edited scheduling note', a.ref); save(); toast('Note saved'); break; }
    case 'move': {
      const a = apById(el.dataset.id), doc = $('#rs-doc').value, date = $('#rs-date').value, time = $('#rs-time').value;
      if (!time) return toast('Pick a free time first');
      if (doc === a.doctorId && date === a.date && time === a.time) return toast('Nothing changed');
      a.history.push({ at: stamp(), text: `Moved to ${fmtDate(date)} ${fmtTime(time)} by ${u.name}` }); Object.assign(a, { doctorId: doc, date, time });
      if (a.change && a.change.status === 'pending') { a.change.status = 'declined'; a.history.push({ at: stamp(), text: 'Open change request closed because staff moved the visit' }); }
      log(u.name, 'Moved appointment', a.ref); save(); openAppt(a.id, false); refresh(); toast('Appointment moved'); break;
    }
    case 'del': { const a = apById(el.dataset.id); if (!confirm(`Delete the appointment for ${fullName(a.patient)} now? This can't be undone.`)) return; DB.appointments = DB.appointments.filter(x => x.id !== a.id); log(u.name, 'Deleted appointment', a.ref); save(); closeLayer(); refresh(); toast('Appointment deleted'); break; }

    case 'new-save': {

      const vt = vtById(v('n-vt'));

        patient: { first: v('n-first').trim(), last: v('n-last').trim(), phone: fmtPhone(v('n-phone')), email: v('n-email').trim(), returning: v('n-ret') === 'yes', sms: v('n-sms') === 'yes', lang: v('n-lang') }, note: '', history: [{ at: stamp(), text: `Added by ${u.name} (${SOURCES[v('n-src')]})` }] };
      DB.appointments.push(a); log(u.name, 'Created appointment', a.ref); save(); closeLayer(); AV.day = a.date; refresh(); toast(`Added for ${fmtDate(a.date)}, ${fmtTime(a.time)}`); break;
    }
    case 'print': printDay(el.dataset.v); break;
    case 'day': AV.day = el.dataset.v; refresh(); break;
    case 'week': AV.day = +el.dataset.v === 0 ? nowParts().date : addDays(AV.day, +el.dataset.v); refresh(); break;
    case 'mode': AV.mode = el.dataset.v; refresh(); break;
    case 'range': AV.range = el.dataset.v; refresh(); break;
    case 'rr': AV.rr = el.dataset.v; refresh(); break;
    case 'tab': AV.tab = el.dataset.v; refresh(); break;
    case 'export': if (can('export')) exportCSV(); break;
    case 'doc': MODAL = null; docModal(el.dataset.id); break;
    case 'swatch': MODAL.data.color = el.dataset.v; $$('.swatch').forEach(x => x.classList.toggle('is-on', x === el)); break;
    case 'lunch-day': { const i = +el.dataset.v, L = MODAL.data.lunch; L.days = L.days.includes(i) ? L.days.filter(x => x !== i) : [...L.days, i]; el.classList.toggle('is-on'); el.setAttribute('aria-pressed', L.days.includes(i)); break; }
    case 'off-add': { const f = $('#off-from').value, t = $('#off-to').value || f; if (!f) return toast('Pick a start date'); if (t < f) return toast('The end date is before the start date'); readDoc(); MODAL.data.timeOff.push({ id: uid('o_'), from: f, to: t, label: $('#off-label').value.trim() || 'Time off' }); docModal(MODAL.data.id); toast('Added. Save to keep it.'); break; }
    case 'off-rm': readDoc(); MODAL.data.timeOff = MODAL.data.timeOff.filter(o => o.id !== el.dataset.v); docModal(MODAL.data.id); break;
    case 'photo-rm': readDoc(); MODAL.data.photo = ''; docModal(MODAL.data.id); break;
    case 'doc-save': {
      const d = readDoc(); if (!d.name.trim()) return toast('Add a name first');
      if (d.lunch.on && d.lunch.end <= d.lunch.start) return toast('The lunch break ends before it starts');

      if (!confirm(`Remove ${d.name}?`)) return; DB.doctors = DB.doctors.filter(x => x.id !== d.id); log(u.name, 'Removed doctor', d.name); save(); MODAL = null; closeLayer(); refresh(); break;
    }
    case 'n-ch': { const N = DB.settings.notify, was = N.channel; N.channel = el.dataset.v; if ((was === 'email') !== (N.channel === 'email')) N.to = N.channel === 'email' ? 'owner@example.com' : '(847) 555-0199'; refresh(); break; }

    case 'save-vt': $$('[data-vt]').forEach(x => { const v = vtById(x.dataset.vt); v[x.dataset.f] = x.type === 'checkbox' ? x.checked : x.dataset.f === 'duration' ? +x.value : x.value.trim() || v.name; }); log(u.name, 'Changed visit types', ''); save(); refresh(); toast('Visit types saved'); break;
    case 'add-vt': DB.visitTypes.push({ id: uid('v_'), name: 'New visit type', duration: 30, active: false }); save(); refresh(); break;

  }

function onInput(e) {
  const el = e.target;
  if (el.dataset.bk && BK) { BK[el.dataset.bk] = el.type === 'checkbox' ? el.checked : el.value; const f = el.closest('.field'); if (f) f.classList.remove('has-err'); }
  if (el.dataset.act === 'search') { AV.q = el.value; const t = $('#apt-table'); if (t) t.innerHTML = aptTable(); }
}
function onChange(e) {
  const el = e.target;
  if (el.hasAttribute('data-finder')) { HOME.vt = el.value; $('#finder').innerHTML = finderHTML(); $('#finder-vt').focus(); return; }
  if (el.dataset.bkSelect && BK) { BK[el.dataset.bkSelect] = el.value; BK.time = ''; refreshBook(); return; }
  if (el.dataset.filter) { AV[el.dataset.filter] = el.value; refresh(); return; }
  if (el.hasAttribute('data-recalc')) {
    const sc = el.closest('[data-scope]').dataset.scope;
    if (sc === 'rs') { const a = apById(AV.drawer); $('#rs-time').innerHTML = timeOpts($('#rs-date').value, a.visitTypeId, $('#rs-doc').value, a.id, $('#rs-date').value === a.date && $('#rs-doc').value === a.doctorId ? a.time : ''); }
    if (sc === 'n') $('#n-time').innerHTML = timeOpts($('#n-date').value, $('#n-vt').value, $('#n-doc').value, null, '');
    return;
  }
  if (el.dataset.f === 'on' && el.dataset.sc !== undefined) $$(`.modal [data-sc="${el.dataset.sc}"][type=time]`).forEach(x => x.disabled = !el.checked);
  if (el.dataset.f === 'open' && el.dataset.h !== undefined) $$(`[data-h="${el.dataset.h}"][type=time]`).forEach(x => x.disabled = !el.checked);
  if (el.dataset.act === 'photo' && el.files[0]) resize(el.files[0], url => { readDoc(); MODAL.data.photo = url; docModal(MODAL.data.id); toast('Photo added. Save to keep it.'); });
}
function onSubmit(e) {
  const f = e.target.dataset.form; if (!f) return; e.preventDefault();
  if (f === 'book') bookSubmit();
  if (f === 'mg-find') mgFind(e.target);
  if (f === 'route') { const from = e.target.from.value.trim(); window.open(`https://www.google.com/maps/dir/?api=1${from ? '&origin=' + encodeURIComponent(from) : ''}&destination=${mq()}`, '_blank', 'noopener'); }
}
function onKey(e) {
  if (e.key === 'Escape' && layer().innerHTML) { closeLayer(); if (isAdmin()) refresh(); return; }
  if (e.key === 'Enter' && e.target.matches('tr[data-act], li[data-act], .cal__appt')) e.target.click();
}

/* ============ router ============ */
function route() {
  closeLayer();
  const h = location.hash;
  document.documentElement.lang = h.startsWith('#/admin') ? 'en' : LANG;
  if (h.startsWith('#/admin')) { AV.view = h.split('/')[2] || 'schedule'; renderAdmin(); }
  else if (h.startsWith('#/book')) { const q = Object.fromEntries(new URLSearchParams(h.split('?')[1] || '')); newBooking({ v: q.v || '', d: /^\d{4}-\d{2}-\d{2}$/.test(q.d || '') ? q.d : '', t: /^\d{2}:\d{2}$/.test(q.t || '') ? q.t : '' }); renderBook(); }
  else if (h.startsWith('#/manage')) { if (MG.id && apById(MG.id)) MG.step = 'view'; else MG.step = 'find'; renderManage(); }
  else if (h.startsWith('#/care/')) renderService(h.split('/')[2]);
  else renderHome();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
window.addEventListener('storage', e => {
  if (e.key !== KEY || !e.newValue) return;
  const before = new Map(DB.appointments.map(a => [a.id, JSON.stringify([a.status, a.change])])), lastAt = DB.notices.reduce((m, x) => x.at > m ? x.at : m, '');
  DB = migrate(JSON.parse(e.newValue)); MEM = e.newValue;
  const fresh = DB.notices.filter(x => x.at > lastAt);
  if (isAdmin()) {
    if (!me()) return;
    if (!layer().innerHTML) refresh();
    DB.appointments.forEach(a => {
      const b = before.get(a.id);
      if (!b) toast(`New ${SOURCES[a.source].toLowerCase()} request: ${fullName(a.patient)}, ${fmtDate(a.date)} ${fmtTime(a.time)}`);
      else if (b !== JSON.stringify([a.status, a.change]) && a.change && a.change.type === 'reschedule' && a.change.status === 'pending') toast(`Change request: ${fullName(a.patient)} wants ${fmtDate(a.change.date)} ${fmtTime(a.change.time)}`);
      else if (b !== JSON.stringify([a.status, a.change]) && a.status === 'cancelled' && a.change && a.change.type === 'cancel') toast(`${fullName(a.patient)} cancelled online. ${fmtDate(a.date)} ${fmtTime(a.time)} is free again.`);
    });
    if (fresh.length) pushMock(fresh[fresh.length - 1]);
  } else if (location.hash.startsWith('#/manage')) refreshManage();
  else if (onHome()) renderHome();
});
document.addEventListener('click', onClick); document.addEventListener('input', onInput); document.addEventListener('change', onChange); document.addEventListener('submit', onSubmit); document.addEventListener('keydown', onKey);
setInterval(() => { const s = $('.state'); if (s) { const st = openState(); s.className = 'state ' + (st.open ? 'is-open' : ''); s.lastChild.textContent = stateText(st); } }, 60000);
if (runRetention()) save();
document.documentElement.lang = LANG;
route();
})();
